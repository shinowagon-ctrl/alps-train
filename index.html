import * as THREE from 'three';

const R = 520;
const SPEED = 20;
const TAU = Math.PI * 2;
const FLOOR = 1.20;
const CEIL = 3.26;
const WIN_X = 1.32;
const SUN = new THREE.Vector3(0.62, 0.24, 0.74).normalize();

const U = {
  valley: 0.32, forest: 1.02, village: 1.65, lake: 2.38,
  viaduct: 3.10, portalIn: 3.60, tunnel: 4.45, portalOut: 5.22, high: 5.65
};
const TUN_A = 3.78, TUN_B = 5.18;

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const saturate = v=>clamp(v,0,1);
const smooth = (a,b,x)=> { const t=saturate((x-a)/(b-a)); return t*t*(3-2*t); };
const fract = v=>v-Math.floor(v);
const wrapTau = a=> { a%=TAU; return a<0?a+TAU:a; };
const hash2 = (x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453123);
function vnoise(x,y){
  const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),ux), lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),ux), uy);
}
function fbm(x,y,o=5){
  let v=0,a=.5,f=1,s=0;
  for(let i=0;i<o;i++){ v+=a*vnoise(x*f,y*f); s+=a; a*=.5; f*=2.05; }
  return v/s;
}
function rng(seed){ let s=seed|0||1; return ()=>{ s^=s<<13;s^=s>>>17;s^=s<<5; return ((s>>>0)/4294967296); }; }

const ua = navigator.userAgent||'';
const isMobile = /iPhone|iPad|iPod|Android/i.test(ua) || Math.min(innerWidth,innerHeight)<520;
let softwareGL = false;
let quality = isMobile ? 'med' : 'high';

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;

(function detectGL(){
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? (gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'') : '';
  softwareGL = /swiftshader|llvmpipe|softpipe|software|microsoft basic render/i.test(name) || !ext;
  if (softwareGL) quality = 'low';
  window.__gl = name || 'unknown';
})();

function applyPixelRatio(){
  const dpr = window.devicePixelRatio || 1;
  const cap = quality==='high' ? 1.6 : quality==='med' ? 1.15 : 0.85;
  renderer.setPixelRatio(Math.min(dpr, cap));
}
function resize(){

    const pr = renderer.getPixelRatio();
    extRT.setSize(Math.floor(w*pr), Math.floor(h*pr));
    if (blurRT) blurRT.setSize(Math.floor(w*pr), Math.floor(h*pr));
  }
}

function makeCanvas(s, fn){
  const c=document.createElement('canvas'); c.width=c.height=s;
  const ctx=c.getContext('2d'); fn(ctx,s);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}
const texWood = makeCanvas(256,(ctx,s)=>{
  for(let y=0;y<s;y++){
    const n=fbm(2,y*0.07,3);
    ctx.fillStyle=`rgb(${110+n*50|0},${70+n*30|0},${38+n*16|0})`;
    ctx.fillRect(0,y,s,1);
  }
  ctx.globalAlpha=.18;
  for(let i=0;i<18;i++){
    const x=hash2(i,2)*s;
    ctx.strokeStyle=`rgb(${60+hash2(i,3)*40|0},${40|0},${20})`;
    ctx.beginPath(); ctx.moveTo(x,0);
    for(let y=0;y<s;y+=4) ctx.lineTo(x+Math.sin(y*.08+i)*6,y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
});
texWood.repeat.set(2,2);

const texFabric = makeCanvas(128,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const n=vnoise(x*.35,y*.35)*22;
    const g=(x+y)%3===0?8:0;
    ctx.fillStyle=`rgb(${110+n-g|0},${28+n*.4|0},${32+n*.3|0})`;
    ctx.fillRect(x,y,1,1);
  }
});

const texCarpet = makeCanvas(128,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const n=vnoise(x*.2,y*.2)*18;

});
texCarpet.repeat.set(8,14);

const texMetal = makeCanvas(64,(ctx,s)=>{

});

const texStone = makeCanvas(256,(ctx,s)=>{
  ctx.fillStyle='#8a8074'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<240;i++){
    const x=hash2(i,1)*s, y=hash2(i,2)*s, w=6+hash2(i,3)*28, h=4+hash2(i,4)*16;
    const n=hash2(i,5);
    ctx.fillStyle=`rgb(${90+n*70|0},${82+n*55|0},${70+n*40|0})`;
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(0,0,0,.12)';
    ctx.fillRect(x,y+h-1,w,1);
  }
});
texStone.repeat.set(2,4);

const texRock = makeCanvas(256,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x+=2){
    const n=fbm(x*.04,y*.04,4);
    const r=90+n*70,g=82+n*60,b=74+n*50;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,2,1);

});
texRock.repeat.set(8,8);

const texBark = makeCanvas(64,(ctx,s)=>{
  for(let y=0;y<s;y++){
    const n=vnoise(1,y*.2)*30;
    ctx.fillStyle=`rgb(${70+n|0},${48+n*.5|0},${30})`;

});

const texNeedle = makeCanvas(64,(ctx,s)=>{

    ctx.fillRect(hash2(i,4)*s,hash2(i,5)*s,1+hash2(i,6)*2,2);

});

const texGlassDirt = makeCanvas(256,(ctx,s)=>{
  ctx.clearRect(0,0,s,s);
  const g=ctx.createRadialGradient(s/2,s/2,s*.28,s/2,s/2,s*.55);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(255,255,255,1)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  ctx.globalAlpha=.25;
  for(let i=0;i<40;i++){
    ctx.fillStyle='rgba(180,180,180,.4)';
    ctx.beginPath(); ctx.arc(hash2(i,1)*s,hash2(i,2)*s,hash2(i,3)*2,0,TAU); ctx.fill();
  }
});

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    sunDir: { value: SUN.clone() },
    tunnel: { value: 0 }
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sunDir; uniform float tunnel;
    void main(){
      vec3 d=normalize(vDir);
      float h=d.y;
      vec3 zenith=vec3(0.18,0.40,0.78);
      vec3 mid=vec3(0.45,0.68,0.90);
      vec3 hor=vec3(0.82,0.78,0.72);
      vec3 warm=vec3(1.0,0.68,0.38);
      vec3 col=mix(hor,mid,smoothstep(-0.08,0.18,h));
      col=mix(col,zenith,smoothstep(0.15,0.72,h));
      col=mix(col,warm, exp(-abs(h-0.02)*10.0)*0.45);
      float mu=max(dot(d,normalize(sunDir)),0.0);
      col+=vec3(1.0,0.92,0.75)*pow(mu, 400.0)*5.0;
      col+=vec3(1.0,0.78,0.45)*pow(mu, 24.0)*0.7;
      col+=vec3(1.0,0.70,0.40)*pow(mu, 6.0)*0.18;
      float py=max(d.y,0.08);
      vec2 cu=d.xz/py*0.35;
      float cl=smoothstep(0.52,0.72, sin(cu.x*1.3+cu.y*0.4)*0.5+0.5) * 0.25;
      cl*=smoothstep(0.02,0.22,d.y)*smoothstep(0.85,0.35,d.y);
      col=mix(col, vec3(1.0,0.97,0.93), cl*0.45);
      col=mix(col, vec3(0.01,0.015,0.03), tunnel);
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4800, 32, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);

function posOnTrack(u, y=0, xLocal=0, yOff=0){
  const phi = -u;
  const inward = new THREE.Vector3(-Math.cos(phi), 0, -Math.sin(phi));
  const forward = new THREE.Vector3(Math.sin(phi), 0, -Math.cos(phi));
  const p = new THREE.Vector3(R*Math.cos(phi), y+yOff, R*Math.sin(phi));
  p.addScaledVector(inward, xLocal);
  return { p, phi, inward, forward, up: new THREE.Vector3(0,1,0) };
}
function applyTrainXform(obj, u, xLocal=0, y=0){
  const { p, inward, forward } = posOnTrack(u, y, xLocal);
  obj.position.copy(p);
  const m = new THREE.Matrix4().makeBasis(inward, new THREE.Vector3(0,1,0), forward);
  obj.quaternion.setFromRotationMatrix(m);
}

function sectorW(u, a, b, fade=0.12){
  u = wrapTau(u);
  if (a < b) {
    if (u>=a && u<=b) return 1;
    const left = (u < a) ? smooth(a-fade,a,u) : 0;
    const right = (u > b) ? smooth(b+fade,b,u) : 0;
    return Math.max(left, right);
  }
  return Math.max(sectorW(u,a,TAU,fade), sectorW(u,0,b,fade));
}
function inTunnelU(u){
  u=wrapTau(u);
  if (u>=TUN_A && u<=TUN_B) {
    const ei = smooth(TUN_A, TUN_A+0.08, u);
    const eo = 1-smooth(TUN_B-0.08, TUN_B, u);
    return Math.min(ei,eo);
  }
  return 0;
}

function heightWorld(x,z){
  const r = Math.hypot(x,z);
  const phi = Math.atan2(z,x);
  const u = wrapTau(-phi);
  const dIn = R - r;
  const dOut = r - R;
  const n1 = fbm(x*0.004, z*0.004, 4);
  const n2 = fbm(x*0.012, z*0.012, 3);
  let h = 0;

  if (r <= R) {
    const shelf = 0.3 + 1.8*n2;
    const meadow = 1.5 + 5*n1 + 2*n2;
    const hills = 12 + 40*n1 + 16*n2;
    const mass =
      540*Math.exp(-((x-20)*(x-20)+(z+30)*(z+30))/(170*170))
      + 440*Math.exp(-((x+150)*(x+150)+(z-140)*(z-140))/(140*140))
      + 370*Math.exp(-((x-140)*(x-140)+(z-160)*(z-160))/(120*120))
      + 250*Math.exp(-((x+50)*(x+50)+(z+190)*(z+190))/(110*110));
    const jag = (fbm(x*0.01,z*0.01,5)-0.45)*0.45*mass;

    if (dIn < 14) h = lerp(0, shelf, smooth(4.5, 14, dIn));
    else if (dIn < 95) h = lerp(shelf, meadow, smooth(14, 95, dIn));
    else if (dIn < 230) h = lerp(meadow, hills + mass*0.12, smooth(95, 230, dIn));
    else h = hills*0.4 + mass + jag;

    const lake = sectorW(u, 1.95, 2.75, 0.16) * smooth(7, 14, dIn) * smooth(320, 180, dIn);
    h = lerp(h, -7.0, saturate(lake*1.15));

    const vil = sectorW(u, 1.32, 1.98, 0.1) * smooth(18, 32, dIn) * smooth(145, 85, dIn);
    h = lerp(h, 3.5+1.2*n2, saturate(vil));

    const gor = sectorW(u, 2.72, 3.52, 0.1);
    const trench = gor * smooth(6, 16, dIn) * smooth(210, 80, dIn);
    h = lerp(h, -90 + 6*n2, saturate(trench));
  } else {
    const berm = 1.2 + 2.5*n2;
    const hills = 18 + 70*n1;
    const far = smooth(250, 700, dOut);
    const peaks = 0
      + 900*Math.exp(-((x-1400)*(x-1400)+(z-400)*(z-400))/(380*380))
      + 1100*Math.exp(-((x-900)*(x-900)+(z+1500)*(z+1500))/(420*420))
      + 800*Math.exp(-((x+1600)*(x+1600)+(z+700)*(z+700))/(360*360))
      + 950*Math.exp(-((x+600)*(x+600)+(z-1700)*(z-1700))/(400*400))
      + 700*Math.exp(-((x-1700)*(x-1700)+(z-1200)*(z-1200))/(300*300))
      + 650*Math.exp(-((x+1800)*(x+1800)+(z-1400)*(z-1400))/(340*340));
    const jag = (fbm(x*0.005,z*0.005,5)-.4)*peaks*0.4;
    if (dOut < 14) h = lerp(0, berm, smooth(4.5, 14, dOut));
    else if (dOut < 220) h = lerp(berm, hills, smooth(14, 220, dOut));
    else h = hills + (peaks+jag)*far;

    const gor = sectorW(u, 2.72, 3.52, 0.1);
    h = lerp(h, -40, gor*smooth(8, 22, dOut)*smooth(150, 40, dOut)*0.5);
  }

  const tun = sectorW(u, TUN_A-0.01, TUN_B+0.01, 0.03);
  if (tun>0) {
    if (Math.abs(r-R)>4.6) {
      const roof = 90 + 40*n1 + 50*Math.exp(-((r-R)*(r-R))/(80*80));
      h = Math.max(h, lerp(h, roof, tun*smooth(4.6, 16, Math.abs(r-R))));
    } else {
      h = 0;
    }
  }
  return h;
}

function buildTerrainBand(r0, r1, nR, nT, skipTunnelCut){
  const g = new THREE.BufferGeometry();
  const pos=[], col=[], idx=[];
  const snowLine = 140;
  for (let i=0;i<=nT;i++){
    const phi = i/nT*TAU;
    const ct=Math.cos(phi), st=Math.sin(phi);
    const u=wrapTau(-phi);
    for (let j=0;j<=nR;j++){
      const rr=lerp(r0,r1,j/nR);
      const x=rr*ct, z=rr*st;
      let y=heightWorld(x,z);
      if (skipTunnelCut && inTunnelU(u)>0.2 && Math.abs(rr-R)<5.5){
        y = 2.8;
      }
      pos.push(x,y,z);
      const n=fbm(x*0.01,z*0.01,3);
      let rC,gC,bC;
      if (y < -6.5) { rC=0.45+n*.05; gC=0.50; bC=0.38; }
      else if (y < 3 && Math.abs(rr-R)<10) { rC=0.38+n*.08; gC=0.36; bC=0.28; }
      else if (y > snowLine + 20 + n*30) { rC=0.88+n*.08; gC=0.91+n*.05; bC=0.94; }
      else if (y > snowLine - 10) {
        const k=smooth(snowLine-10, snowLine+30, y);
        rC=lerp(0.40+n*.08, 0.90, k); gC=lerp(0.42+n*.05, 0.92, k); bC=lerp(0.30, 0.94, k);
      } else {
        const grass=0.28+n*.10;
        rC=0.22+n*.06; gC=grass; bC=0.14+n*.03;
        if (y>70){ rC=lerp(rC,0.5,0.5); gC=lerp(gC,0.48,0.5); bC=lerp(bC,0.42,0.5); }
      }
      if (sectorW(u,0.0,0.7,0.2)>0.3 && y<40){
        gC=Math.min(0.55,gC+0.08); rC*=0.95;
      }
      col.push(rC,gC,bC);
    }
  }
  const w=nR+1;
  for(let i=0;i<nT;i++){
    for(let j=0;j<nR;j++){
      const a=i*w+j, b=a+1, c=a+w, d=c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const nrm=g.getAttribute('normal');
  const clr=g.getAttribute('color');
  const p=g.getAttribute('position');
  for(let i=0;i<p.count;i++){
    const y=p.getY(i), ny=nrm.getY(i);
    if (y>90 && ny>0.38){
      const k=saturate((y-90)/80)*saturate((ny-0.38)/0.4);
      clr.setXYZ(i, lerp(clr.getX(i),0.93,k), lerp(clr.getY(i),0.95,k), lerp(clr.getZ(i),0.97,k));
    }
  }
  clr.needsUpdate=true;
  return g;
}

const nTheta = quality==='low' ? 180 : quality==='med' ? 240 : 300;
const terrMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.90, metalness:0.0, envMapIntensity:0.15 });

(function buildLake(){
  const shape=new THREE.Shape();
  const samples=96;
  let first=true;
  for(let i=0;i<=samples;i++){
    const u=lerp(1.98, 2.74, i/samples);
    const phi=-u;
    const r1=R-36;
    const x=r1*Math.cos(phi), z=r1*Math.sin(phi);
    if(first){ shape.moveTo(x,z); first=false; } else shape.lineTo(x,z);
  }
  for(let i=samples;i>=0;i--){
    const u=lerp(1.98, 2.74, i/samples);
    const phi=-u;
    const r2=Math.max(85, R-255 + 40*Math.sin(i*0.4));
    shape.lineTo(r2*Math.cos(phi), r2*Math.sin(phi));
  }
  const geo=new THREE.ShapeGeometry(shape, 8);
  geo.rotateX(-Math.PI/2);
  geo.translate(0, -6.15, 0);
  const mat=new THREE.ShaderMaterial({
    uniforms:{ sunDir:{value:SUN.clone()}, time:{value:0} },
    vertexShader:`varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vW; uniform vec3 sunDir; uniform float time;
      void main(){
        vec3 N=vec3(0,1,0);
        vec3 V=normalize(cameraPosition-vW);
        float F=pow(1.0-max(dot(V,N),0.0), 3.0);
        vec3 deep=vec3(0.05,0.22,0.28);
        vec3 shallow=vec3(0.18,0.52,0.55);
        vec3 col=mix(deep,shallow,0.35);
        vec3 skyC=vec3(0.55,0.72,0.88);
        vec3 sunC=vec3(1.0,0.86,0.6);
        float spec=pow(max(dot(reflect(-sunDir,N),V),0.0), 80.0);
        col=mix(col,skyC,F*0.75);
        col+=sunC*spec*0.65;
        float haze=1.0-exp(-length(vW-cameraPosition)*0.00045);
        col=mix(col,vec3(0.62,0.72,0.82),haze*0.5);
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const lake=new THREE.Mesh(geo,mat);
  worldGroup.add(lake);
  window.__lakeMat=mat;
})();

function mergeGeos(geos){
  let n=0;
  geos.forEach(g=>{ n+=g.attributes.position.count; });
  const pos=new Float32Array(n*3), nrm=new Float32Array(n*3), uv=new Float32Array(n*2);
  const idx=[];
  let bo=0;
  geos.forEach(g=>{
    const p=g.attributes.position, nn=g.attributes.normal, u=g.attributes.uv;
    for(let i=0;i<p.count;i++){
      pos[(bo+i)*3]=p.getX(i); pos[(bo+i)*3+1]=p.getY(i); pos[(bo+i)*3+2]=p.getZ(i);
      if(nn){ nrm[(bo+i)*3]=nn.getX(i); nrm[(bo+i)*3+1]=nn.getY(i); nrm[(bo+i)*3+2]=nn.getZ(i); }
      if(u){ uv[(bo+i)*2]=u.getX(i); uv[(bo+i)*2+1]=u.getY(i); }
    }
    if(g.index){ for(let i=0;i<g.index.count;i++) idx.push(g.index.getX(i)+bo); }
    else { for(let i=0;i<p.count;i++) idx.push(bo+i); }
    bo+=p.count;
  });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm,3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
function makePineGeo(snowy){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.22,2.2,5), new THREE.MeshStandardMaterial({ map:texBark, color:0x6a4a32, roughness:0.95 }));
  trunk.position.y=1.1; g.add(trunk);
  const needle=new THREE.MeshStandardMaterial({ map:texNeedle, color: snowy?0x8aa090:0x1e4a28, roughness:0.9 });
  const snowM=new THREE.MeshStandardMaterial({ color:0xeff4f8, roughness:0.8 });
  const layers=5;
  for(let i=0;i<layers;i++){
    const t=i/(layers-1);
    const rad=2.1-t*1.55, hgt=1.7-t*0.15, y=1.5+i*0.85;
    const cone=new THREE.Mesh(new THREE.ConeGeometry(rad,hgt,7), needle);
    cone.position.y=y; g.add(cone);
    if(snowy){
      const cap=new THREE.Mesh(new THREE.ConeGeometry(rad*0.72,hgt*0.28,7), snowM);
      cap.position.y=y+hgt*0.28; g.add(cap);
    }
  }
  g.updateMatrixWorld(true);
  const all=[];
  g.traverse(ch=>{ if(ch.isMesh){ const gg=ch.geometry.clone(); ch.updateWorldMatrix(true,false); gg.applyMatrix4(ch.matrixWorld); all.push(gg);} });
  return mergeGeos(all);
}

(function placeCandidates(){

function addChalet(x,y,z, rot, scale, seed){
  const rnd=rng(seed);
  const g=new THREE.Group();
  const bodyW=6.2*scale, bodyD=8.4*scale, bodyH=4.2*scale;
  const plaster=new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.08,0.25,0.62+rnd()*0.15), roughness:0.9 });
  const wood=new THREE.MeshStandardMaterial({ map:texWood, color:0xc9a07a, roughness:0.85 });
  const body=new THREE.Mesh(new THREE.BoxGeometry(bodyW,bodyH,bodyD), rnd()<0.5?plaster:wood);
  body.position.y=bodyH/2; g.add(body);
  const rw=bodyW+1.6*scale, rd=bodyD+1.8*scale, rh=3.4*scale;
  const roofMat=new THREE.MeshStandardMaterial({ color:0x5a3a28, roughness:0.82, map:texWood });

  const len=Math.hypot(rh,hw);

    const slab=new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, rd), roofMat);
    slab.position.set(s*hw*0.5, bodyH+rh*0.5, 0);
    slab.rotation.z = s*slant;

    const snow=new THREE.Mesh(new THREE.BoxGeometry(len*0.95, 0.22, rd*0.92), snowRoof);
    snow.position.set(s*hw*0.5, bodyH+rh*0.5+0.18, 0);
    snow.rotation.z=s*slant;

  }
  for(const s of [-1,1]){
    const shp=new THREE.Shape();
    shp.moveTo(-bodyW/2,0); shp.lineTo(bodyW/2,0); shp.lineTo(0,rh);
    const gg=new THREE.Mesh(new THREE.ShapeGeometry(shp), wood);
    gg.position.set(0,bodyH, s*bodyD/2);

  const shut=new THREE.MeshStandardMaterial({ color:0x2e5a38, roughness:0.8 });

  door.position.set(bodyW/2+0.03, 0.8*scale, 0); g.add(door);
  const ch=new THREE.Mesh(new THREE.BoxGeometry(0.6*scale,1.8*scale,0.6*scale), new THREE.MeshStandardMaterial({color:0x8a6048, roughness:0.9}));
  ch.position.set(-bodyW*0.2, bodyH+rh*0.35+0.9*scale, bodyD*0.2); g.add(ch);
  g.position.set(x,y,z);
  g.rotation.y=rot;
  worldGroup.add(g);

function updateMoving(u){
  const sSpacing=0.7;
  const base=u*R;
  const start=Math.floor((base-SLEEPER_N*sSpacing*0.45)/sSpacing);
  for(let i=0;i<SLEEPER_N;i++){
    const dist= (start+i)*sSpacing;
    const uu=dist/R;
    const {p,inward,forward}=posOnTrack(wrapTau(uu),0,0);
    _p.copy(p); _p.y=-0.02;
    _q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(inward,new THREE.Vector3(0,1,0),forward));
    _m.compose(_p,_q,_s);
    sleepers.setMatrixAt(i,_m);
  }
  sleepers.instanceMatrix.needsUpdate=true;

  const pSp=48;
  const pStart=Math.floor((base-POLE_N*pSp*0.35)/pSp);
  for(let i=0;i<POLE_N;i++){
    const dist=(pStart+i)*pSp;
    const uu=wrapTau(dist/R);
    const hide=inTunnelU(uu)>0.2;
    const {inward,forward}=posOnTrack(uu,0,0);
    const side = (i%2===0) ? -3.3 : 4.2;
    const tt=posOnTrack(uu,0, side);
    _p.copy(tt.p); _p.y = hide? -20 : Math.max(0, heightWorld(tt.p.x,tt.p.z));
    if (sectorW(uu,2.72,3.52,0.05)>0.7 && side>0) _p.y=-20;
    _q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(inward,new THREE.Vector3(0,1,0),forward));
    _m.compose(_p,_q, hide? new THREE.Vector3(0,0,0): _s);
    poles.setMatrixAt(i,_m);
    const armP=_p.clone(); armP.y+=6.4; armP.addScaledVector(inward, side>0? -0.6: 0.6);
    _m.compose(armP,_q, hide? new THREE.Vector3(0,0,0): _s);
    arms.setMatrixAt(i,_m);
  }
  poles.instanceMatrix.needsUpdate=true;
  arms.instanceMatrix.needsUpdate=true;

  const scored=treeCandidates.map((c,i)=>{
    let d=Math.abs(wrapTau(c.u-u));
    if(d>Math.PI) d=TAU-d;
    return {i, d, c};
  }).sort((a,b)=>a.d-b.d);

  let gi=0, si=0;
  const usedG=pines.count, usedS=snowPines.count;
  for(const it of scored){
    const c=it.c;
    const tt=posOnTrack(c.u,0,c.xLocal);
    _p.set(tt.p.x, c.y, tt.p.z);
    _q.setFromAxisAngle(new THREE.Vector3(0,1,0), c.rot);
    const sc=new THREE.Vector3(c.sc,c.sc,c.sc);
    _m.compose(_p,_q,sc);
    if(c.snowy){
      if(si<usedS){ snowPines.setMatrixAt(si++,_m); }
    } else {
      if(gi<usedG){ pines.setMatrixAt(gi++,_m); }
    }
    if(gi>=usedG && si>=usedS) break;
  }
  const zero=new THREE.Vector3(0,0,0);
  while(gi<usedG){ _m.compose(new THREE.Vector3(0,-50,0),_q,zero); pines.setMatrixAt(gi++,_m); }
  while(si<usedS){ _m.compose(new THREE.Vector3(0,-50,0),_q,zero); snowPines.setMatrixAt(si++,_m); }
  pines.instanceMatrix.needsUpdate=true;
  snowPines.instanceMatrix.needsUpdate=true;

  for(const c of consist){
    applyTrainXform(c.car, wrapTau(u + c.d/R), 0, 0);
  }
}

    pinch0=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    fov0=lookFov;

}
function onPtrMove(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const a=[...pointers.values()];
    const d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    if(pinch0>10){
      lookFov=clamp(fov0 * (pinch0/Math.max(20,d)), 28, 85);
    }
    markInput();
    return;
  }
  if(!dragging) return;
  const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
  lastPX=e.clientX; lastPY=e.clientY;
  const sens=0.0045 * (lookFov/52);
  lookYaw -= dx*sens;
  lookPitch += dy*sens;
  lookPitch=clamp(lookPitch, -1.45, 1.45);
  markInput();
}
function onPtrUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch0=0;
  if(pointers.size===0) dragging=false;
}
canvas.addEventListener('pointerdown', onPtrDown);
canvas.addEventListener('pointermove', onPtrMove);
window.addEventListener('pointerup', onPtrUp);
window.addEventListener('pointercancel', onPtrUp);
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  lookFov=clamp(lookFov + e.deltaY*0.03, 28, 85);
  markInput();
  $hint.classList.add('gone');
}, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

let exposure = 1.05;
let tunnelSmooth=0;
let exitBloom=0;
let prevTun=0;
let cubeN=0;
let t0 = performance.now()/1000;
let fixedT = null;
let ready=false;
let lastReal=t0;
let fpsEma=30;

function currentT(){
  if(fixedT!=null) return fixedT;
  return performance.now()/1000 - t0;
}

function applyLook(dt, t){
  const now = performance.now()/1000;
  if(!holdLook && !dragging && pointers.size===0 && lastInput>0 && (now-lastInput)>IDLE_S){
    const k=1-Math.exp(-dt*1.6);
    lookYaw += (DEFAULT_YAW-lookYaw)*k;
    lookPitch += (DEFAULT_PITCH-lookPitch)*k;
    lookFov += (DEFAULT_FOV-lookFov)*k;
  }
  const dist=t*SPEED;
  const joint=dist%25;
  const clack=Math.exp(-joint*7)*0.01;
  const bounce=Math.sin(t*11.7)*0.0035 + Math.sin(t*3.1)*0.007 + clack;
  const roll=Math.sin(t*2.55)*0.007 + Math.sin(t*6.8)*0.0025;
  const yawS=Math.sin(t*1.65)*0.0035;

  camera.position.set(CAM_LOCAL.x, CAM_LOCAL.y+bounce, CAM_LOCAL.z);
  camera.fov=lookFov;
  camera.updateProjectionMatrix();

  const cy=Math.cos(lookYaw+yawS), sy=Math.sin(lookYaw+yawS);
  const cp=Math.cos(lookPitch), sp=Math.sin(lookPitch);
  // Local camera space: +X is out the window, +Y up, +Z along the car.
  // Camera looks down -Z, so we build a local quaternion (lookAt is world-space and would be wrong on a parented camera).
  const dir=new THREE.Vector3(cp*cy, sp, cp*sy);
  const up=new THREE.Vector3(Math.sin(roll), Math.cos(roll), 0).normalize();
  const rotM=new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), dir, up);
  camera.quaternion.setFromRotationMatrix(rotM);
}

function renderFrame(dt){
  const t=currentT();
  const u=wrapTau((t*SPEED)/R);

  applyTrainXform(trainGroup, u, 0, 0);
  updateMoving(u);

  const tun=inTunnelU(u);
  tunnelSmooth += (tun-tunnelSmooth)*Math.min(1, dt*3.5);
  skyMat.uniforms.tunnel.value=tunnelSmooth*0.96;
  if(window.__lakeMat) window.__lakeMat.uniforms.time.value=t;

  let targetExp=1.08;
  if(tun>0.15) targetExp=0.72 + 0.15*(1-tun);
  if(prevTun>0.55 && tun<0.55) exitBloom=1;
  prevTun=tun;
  exitBloom=Math.max(0, exitBloom-dt*0.45);
  if(exitBloom>0 && tun<0.7) targetExp += exitBloom*1.7;

  const rate = targetExp>exposure ? 2.8 : 1.1;
  exposure += (targetExp-exposure)*(1-Math.exp(-dt*rate));
  renderer.toneMappingExposure = exposure;

  sun.intensity = 2.35*(1-tunnelSmooth*0.92);
  hemi.intensity = 0.55*(1-tunnelSmooth*0.75);
  sunFill.intensity = 0.35*(1-tunnelSmooth*0.9);
  const cabinBoost = 1 + tunnelSmooth*1.6;
  cabinLight.intensity=1.15*cabinBoost;
  cabinLight2.intensity=0.55*cabinBoost;
  cabinLight3.intensity=0.45*cabinBoost;
  const tunnelFill=interiorGroup.getObjectByName("tunnelFill");
  if(tunnelFill) tunnelFill.intensity=0.15+tunnelSmooth*2.4;
  glassMats.forEach(m=>{
    m.opacity = 0.08 + tunnelSmooth*0.16;
    m.envMapIntensity = 0.7 + tunnelSmooth*1.6 + exitBloom*0.3;
  });
  scene.fog.density = 0.00045 + tunnelSmooth*0.0012;
  scene.fog.color.setRGB(
    lerp(0.60, 0.02, tunnelSmooth),
    lerp(0.70, 0.025, tunnelSmooth),
    lerp(0.79, 0.03, tunnelSmooth)
  );
  renderer.setClearColor(scene.fog.color, 1);

  applyLook(dt, t);

  cubeN++;
  const cubeEvery = softwareGL? 8 : 3;
  if(cubeN%cubeEvery===1){
    worldGroup.visible=false; sky.visible=false;
    interiorGroup.traverse(o=>{ if(o.userData.isGlass) o.visible=false; });
    cubeCam.update(renderer, scene);
    interiorGroup.traverse(o=>{ if(o.userData.isGlass) o.visible=true; });
    worldGroup.visible=true; sky.visible=true;
  }

  const blurAmt = (quality==='low'?0 : 0.55) * (1-tunnelSmooth*0.7);
  if(usePost && !softwareGL){
    renderer.setRenderTarget(extRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    postMat.uniforms.tDiffuse.value=extRT.texture;
    postMat.uniforms.blurAmt.value=blurAmt;
    postMat.uniforms.res.value.set(extRT.width, extRT.height);
    postMat.uniforms.exposureBoost.value=1+exitBloom*0.35;
    postMat.uniforms.tunnel.value=tunnelSmooth;
    renderer.render(postScene, postCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

function tick(){
  const now=performance.now()/1000;
  let dt=Math.min(0.05, now-lastReal);
  lastReal=now;
  if(dt>0) fpsEma = fpsEma*0.9 + (1/dt)*0.1;
  if(!softwareGL && quality==='high' && fpsEma<24 && ready){
    quality='med'; applyPixelRatio(); usePost=true;
  }
  renderFrame(dt);
  if(!ready){
    ready=true;
    $load.classList.add('gone');
    setTimeout(()=>{ if($load.parentNode) $load.remove(); }, 900);
    window.__ready=true;
  }
  requestAnimationFrame(tick);
}

window.addEventListener('resize', ()=>{ applyPixelRatio(); resize(); });
resize();

function snapToTime(t){
  fixedT = t;
  lastInput=performance.now()/1000;
  const u=wrapTau((t*SPEED)/R);
  const tun=inTunnelU(u);
  tunnelSmooth = tun;
  exposure = tun>0.5 ? 0.75 : 1.08;
  exitBloom = 0;
  prevTun = tun;
  renderer.toneMappingExposure = exposure;
}
window.__setT = (t)=>{ snapToTime(t); };
window.__setU = (u)=>{ snapToTime((wrapTau(u)*R)/SPEED); };
window.__setSegment = (name)=>{
  const v=U[name]; if(v==null) return;
  snapToTime((v*R)/SPEED);
};
window.__setLook = (yaw,pitch,fov)=>{
  if(yaw!=null) lookYaw=yaw;
  if(pitch!=null) lookPitch=pitch;
  if(fov!=null) lookFov=fov;
  holdLook=true;
};
window.__resetLook = ()=>{ lookYaw=DEFAULT_YAW; lookPitch=DEFAULT_PITCH; lookFov=DEFAULT_FOV; holdLook=true; };
window.__forceRender = ()=>{ renderFrame(1/30); };
window.__state = ()=>{
  const t=currentT(), u=wrapTau((t*SPEED)/R);
  return { t, u, tun:inTunnelU(u), exposure, fov:lookFov, yaw:lookYaw, pitch:lookPitch, quality, softwareGL, gl:window.__gl, fps:fpsEma };
};
window.__ready=false;
window.__quality=quality;

setTimeout(()=>$hint.classList.add('gone'), 7000);

lastInput = 0;
requestAnimationFrame(tick);
</script>
</body>
</html>
