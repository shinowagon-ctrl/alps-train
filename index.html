<script type="x-shader/x-fragment" id="world-fs">
// ===== outside world: raymarched alpine terrain =====
precision highp float;
uniform vec2 uRes;
uniform mat4 uCamWorld;
uniform mat4 uLocalCam;
uniform mat4 uProjInv;
uniform vec3 uSun;
uniform vec3 uSunCol;
uniform vec3 uAmbCol;
uniform float uTime;
uniform float uQ;      // 0 low .. 1 high
uniform sampler2D tSky;
uniform float uNoMask;
uniform float uDebug;
varying vec2 vUv;

#define PI 3.14159265
const float L_LOOP = 6000.;
const float GX = 3700.;
const float WATER = 622.;

float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
float noise(vec2 x){vec2 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  float a=hash12(p),b=hash12(p+vec2(1,0)),c=hash12(p+vec2(0,1)),d=hash12(p+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
vec3 noised(vec2 x){vec2 p=floor(x),w=fract(x);
  vec2 u=w*w*w*(w*(w*6.-15.)+10.);vec2 du=30.*w*w*(w*(w-2.)+1.);
  float a=hash12(p),b=hash12(p+vec2(1,0)),c=hash12(p+vec2(0,1)),d=hash12(p+vec2(1,1));
  float k1=b-a,k2=c-a,k4=a-b-c+d;
  return vec3(-1.+2.*(a+k1*u.x+k2*u.y+k4*u.x*u.y),2.*du*vec2(k1+k4*u.y,k2+k4*u.x));}
float noise3(vec3 x){vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(p),hash13(p+vec3(1,0,0)),f.x),mix(hash13(p+vec3(0,1,0)),hash13(p+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(p+vec3(0,0,1)),hash13(p+vec3(1,0,1)),f.x),mix(hash13(p+vec3(0,1,1)),hash13(p+vec3(1,1,1)),f.x),f.y),f.z);}
const mat2 m2=mat2(0.8,-0.6,0.6,0.8);
float fbm4(vec2 p){float a=0.,b=.5;for(int i=0;i<4;i++){a+=b*noise(p);p=m2*p*2.03;b*=.5;}return a/.9375;}
float fbm3(vec3 p){float a=0.,b=.5;for(int i=0;i<4;i++){a+=b*noise3(p);p=p*2.02+vec3(1.7,9.2,3.1);b*=.5;}return a/.9375;}

// eroded terrain fbm (derivative damped) + ridges
float gOctF=-1.;
float fbmT(vec2 p,int oct){
  float a=0.,b=1.;vec2 d=vec2(0.);
  float of = gOctF>0. ? gOctF : float(oct);
  int on=int(ceil(of));
  for(int i=0;i<14;i++){ if(i>=on)break;
    vec3 n=noised(p);
    d+=n.yz;
    float r = (i<3) ? (1.-abs(n.x))*2.-1. : n.x;   // sharp ridges on low octaves
    float wgt = clamp(of-float(i),0.,1.);
    a+=wgt*b*r/(1.+dot(d,d));
    b*=.5; p=m2*p*2.;
  }
  return a;
}

float trackZ(float x){return 140.*sin(x/950.)+55.*sin(x/420.+1.3)-200.*exp(-pow((x-GX)/300.,2.));}
float trackZd(float x){float u=(x-GX)/300.;return 140./950.*cos(x/950.)+55./420.*cos(x/420.+1.3)+200.*2.*u/300.*exp(-u*u);}
float trackY(float x){return 632.+16.*sin(x/1400.+.5);}

float lakeMask(float x){return smoothstep(250.,560.,x)*(1.-smoothstep(1850.,2150.,x));}
float villageMask(float x){return smoothstep(2000.,2250.,x)*(1.-smoothstep(2850.,3100.,x));}
// signed depth inside nearest tunnel (positive inside), large negative far away
float tunnelE(float x){
  float e1=min(x+500.,300.-x);
  float e2=min(x-5500.,6300.-x);
  return max(e1,e2);
}
float gorgeK(vec2 q){ float w=175.+70.*(noise(vec2(q.y/180.,3.))-.5); return clamp(1.-abs(q.x-GX+25.*sin(q.y/230.)+18.*(noise(q/40.)-.5))/w,0.,1.); }

float gOctAdd=0.;
float terrainH(vec2 q,int oct){
  float x=q.x; float tz=trackZ(x), ty=trackY(x); float d=q.y-tz;
  float lm=lakeMask(x), vm=villageMask(x);
  float a=fbmT(q*(1./2300.)+vec2(1.7,9.2),oct);
  float mt=2900.*smoothstep(-0.95,1.2,a);
  mt = mt*mt/2900.*0.6 + mt*0.4;
  float lo=mix(mix(700.,2300.,lm),1300.,vm);
  float rightM=smoothstep(lo,lo+mix(2500.,5500.,lm),d);
  float leftM=smoothstep(-90.,-1300.,d);
  float mm=max(rightM,leftM);
  float ad=abs(d);
  float vf=ty-3.5+max(ad-14.,0.)*0.035+38.*(fbm4(q/380.)-.5)*smoothstep(20.,320.,ad);
  // lake basin
  vf-=lm*80.*smoothstep(16.,75.,d)*(1.-smoothstep(lo-250.,lo+150.,d));
  // village slope
  vf+=vm*max(d-45.,0.)*0.11*(1.-smoothstep(900.,1400.,d))*step(0.,d);
  float h=vf+mm*mt+mm*mm*120.*a;
  // gorge
  float g=gorgeK(q);
  h-=smoothstep(0.,0.6,g)*165.*(1.-0.35*smoothstep(-0.5,1.,a));
  if(g>0.01){ float wall=smoothstep(0.02,0.25,g)*(1.-smoothstep(0.5,0.62,g)); h+=wall*((fbm4(q/22.)-.5)*26.+(noise(q/5.)-.5)*5.); }
  // track bed
  float flt=(1.-smoothstep(4.5,15.,ad))*(1.-smoothstep(0.05,0.4,g));
  h=mix(h,ty-0.7,flt);
  // tunnel spurs
  float e=tunnelE(x);
  if(e>-120.){
    float sp=ty+mix(-16.,30.,smoothstep(-9.,2.,e))+300.*smoothstep(0.,380.,e)+45.*fbm4(q/160.)*smoothstep(-5.,80.,e);
    sp-=(1.-smoothstep(0.,70.,e))*smoothstep(10.,40.,d)*60.*(1.-smoothstep(-2.,6.,e)*0.6);
    float k=30.; float m=clamp(0.5+0.5*(sp-h)/k,0.,1.); h=mix(h,sp,m)+k*m*(1.-m);
  }
  return h;
}

float forestMask(vec2 q,float h,float d,float ty){
  float f=smoothstep(0.46,0.64,fbm4(q/650.+vec2(4.,1.)));
  f=max(f, smoothstep(0.60,0.78,fbm4(q/260.+7.)));
  f*=1.-lakeMask(q.x)*step(0.,d)*(1.-smoothstep(900.,1500.,d));
  f*=mix(0.35,1.,smoothstep(40.,140.,abs(d)));
  f*=1.-smoothstep(ty+380.,ty+620.,h+120.*fbm4(q/300.));
  f*=smoothstep(9.,16.,abs(d));
  f*=step(WATER+1.5,h);
  f*=1.-villageMask(q.x)*smoothstep(-100.,50.,d)*(1.-smoothstep(900.,1100.,d))*0.85;
  f*=1.-smoothstep(0.45,0.6,gorgeK(q))*0.8;
  return f;
}

float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}

// ---- trees ----
const float TCS=10.;
float treeD(vec3 p,float gh,float f,float t){
  vec2 cid=floor(p.xz/TCS);
  float r0=hash12(cid);
  vec2 fr=p.xz/TCS-cid; vec2 bd=min(fr,1.-fr)*TCS;
  float cellD=min(bd.x,bd.y)+0.3+0.0012*t;
  if(r0>f) return cellD;
  vec2 c=(cid+0.5+(vec2(hash12(cid+3.7),hash12(cid+9.1))-.5)*0.3)*TCS;
  float th=12.+14.*hash12(cid+5.1);
  float rad=th*0.19;
  vec2 lp=p.xz-c; float ly=p.y-gh;
  float rr=length(lp);
  float yy=clamp(ly/th,0.,1.);
  float tier=0.82+0.18*fract(ly*0.55+r0*7.);
  float cr=rad*(1.-yy)*tier*(0.9+0.1*sin(atan(lp.y,lp.x)*7.+r0*20.));
  float dd=(rr-cr)*0.7;
  dd=max(dd,ly-th);
  dd=max(dd,1.6-ly);
  float trunk=max(rr-0.28,ly-th*0.5);
  dd=min(dd,trunk);
  return min(dd,cellD);
}

// ---- chalets ----
const float HCS=34.;
float houseD(vec3 p,float x,float d,float ty,float t,out float isRoof){
  isRoof=0.;
  vec2 lq=vec2(x,d);
  vec2 cid=floor(lq/HCS);
  vec2 fr=lq/HCS-cid; vec2 bd=min(fr,1.-fr)*HCS;
  float cellD=min(bd.x,bd.y)+0.5+0.0012*t;
  float r=hash12(cid+41.);
  vec2 cc=(cid+.5)*HCS;
  float vmk=villageMask(cc.x);
  float pres=vmk*smoothstep(45.,80.,cc.y)*(1.-smoothstep(700.,1000.,cc.y));
  if(r>pres*0.85) return cellD;
  float wx=4.5+2.5*hash12(cid+1.),wz=5.+2.*hash12(cid+2.),wh=5.5+2.5*hash12(cid+3.);
  vec2 off=(vec2(hash12(cid+4.),hash12(cid+5.))-.5)*(HCS-2.*max(wx,wz)-6.);
  vec2 c=cc+off;
  float cz=trackZ(c.x)+c.y;
  float hb=terrainH(vec2(c.x,cz),5);
  if(hb<WATER+1.5) return cellD;
  vec3 lp=vec3(lq.x-c.x,p.y-hb,lq.y-c.y);
  float walls=sdBox(lp-vec3(0.,wh*.5-1.5,0.),vec3(wx,wh*.5+1.5,wz));
  float ridge=wh+wx*0.5;
  vec2 n=normalize(vec2(0.5,1.));
  float rp=dot(vec2(abs(lp.x),lp.y-ridge),n);
  walls=max(walls,rp);
  float roof=max(max(abs(rp+0.3)-0.3,abs(lp.z)-(wz+1.2)),abs(lp.x)-(wx+1.3));
  if(roof<walls) isRoof=1.;
  return min(min(walls,roof),cellD);
}

float viaductD(float gu,float dp,float ly,float hl,float w,float parH){
  float hw=w+max(-ly-2.,0.)*0.025;
  float st=max(max(abs(dp)-hw,ly+0.7),abs(gu)-hl);
  st=max(st,-ly-170.);
  float u=mod(gu+11.,22.)-11.;
  float spring=-14.;
  float hole=min(max(abs(u)-8.0,ly-spring),length(vec2(u,ly-spring))-8.0);
  float spring2=-50.;
  float hole2=min(max(abs(u)-6.8,ly-spring2),length(vec2(u,ly-spring2))-6.8);
  hole=min(max(hole,-ly-36.),hole2);
  // keyed cornice line
  st=max(st,-hole);
  st=min(st,max(max(abs(dp)-(w+0.25),abs(ly+1.0)-0.25),abs(gu)-hl));
  float par=max(max(abs(abs(dp)-(w-0.2))-0.2,ly-parH),abs(gu)-hl);
  par=max(par,-ly-0.8);
  return min(st,par);
}

// map: x=dist, y=material
// 1 terrain 2 tree 3 house wall 4 roof 5 stone 6 pole 7 church 8 lamp
vec2 map(vec3 p,float t){
  float x=p.x; float tz=trackZ(x), ty=trackY(x); float d=p.z-tz;
  float sl=trackZd(x); float cosA=inversesqrt(1.+sl*sl); float dp=d*cosA;
  int oct=int(gOctAdd)+(t<900.?9:(t<5000.?8:6));
  if(uQ<0.5) oct-=1;
  gOctF=clamp(10.8-1.3*log2(max(t,60.)/120.),4.5,11.)+gOctAdd-(uQ<0.5?1.:0.);
  float h=terrainH(p.xz,oct);
  gOctF=-1.;
  float res=(p.y-h)*0.5; float mat=1.;
  float ly=p.y-ty;
  float e=tunnelE(x);
  // tunnel tube carve + portals
  if(e>-8. && abs(dp)<13. && ly<14.){
    float carve=max(length(vec2(dp,ly-2.4))-4.5,-0.7-ly);
    if(-carve>res){res=-carve;mat=9.;}
    // portal faces
    float pe=min(abs(x+500.),abs(x-300.)); pe=min(pe,min(abs(x-5500.),abs(x-6300.)));
    if(pe<6.){
      float face=max(sdBox(vec3(pe-1.2,ly-5.,dp),vec3(1.4,7.,8.5)),-carve+0.0);
      face=max(face,-(length(vec2(dp,ly-2.4))-4.5));
      if(face<res){res=face;mat=5.;}
    }
    // lamps
    if(e>2.){
      float lx=mod(x,12.)-6.;
      float lamp=sdBox(vec3(lx,ly-3.4,abs(dp)-4.2),vec3(0.25,0.07,0.07));
      if(lamp<res){res=lamp;mat=8.;}
    }
  }
  // trees
  float tlod=900.*(0.5+0.5*uQ);
  if(p.y-h<30.){
    float f=forestMask(p.xz,h,d,ty);
    if(f>0.01){
      if(t<tlod){
        float td=treeD(p,h,f,t);
        if(td<res){res=td;mat=2.;}
      } else {
        float cb=(p.y-h-16.*smoothstep(0.1,0.5,f)*(0.55+0.45*noise(p.xz/7.)))*0.5;
        if(cb<res){res=cb;mat=2.5;}
      }
    }
  }
  // village
  float vm=villageMask(x);
  if(vm>0.01 && d>30. && d<1100. && p.y-h<18.){
    float isRoof;
    float hd=houseD(p,x,d,ty,t,isRoof);
    if(hd<res){res=hd;mat=3.+isRoof;}
    // church
    vec2 cp=vec2(2560.,330.);
    if(abs(x-cp.x)<40. && abs(d-cp.y)<40.){
      float cz=trackZ(cp.x)+cp.y; float hb=terrainH(vec2(cp.x,cz),5);
      vec3 lp=vec3(x-cp.x,p.y-hb,d-cp.y);
      float nave=sdBox(lp-vec3(0.,4.,10.),vec3(6.,6.,12.));
      vec2 n=normalize(vec2(0.7,1.));
      nave=min(max(nave,dot(vec2(abs(lp.x),lp.y-14.5),n)), max(max(abs(dot(vec2(abs(lp.x),lp.y-14.5),n)+0.3)-0.3,abs(lp.z-10.)-12.8),abs(lp.x)-6.8));
      float tower=sdBox(lp-vec3(0.,12.,-4.),vec3(2.8,14.,2.8));
      vec3 sp=lp-vec3(0.,26.,-4.);
      float spire=max(max(abs(sp.x),abs(sp.z))*0.97+sp.y*0.21-3.0,-sp.y);
      spire=max(spire,sp.y-14.);
      float ch=min(min(nave,tower),spire);
      if(ch<res){res=ch;mat=7.+step(spire,min(nave,tower))*0.5;}
    }
  }
  // viaduct (ours, follows the track)
  float gu=x-GX;
  {
    float bb=sdBox(vec3(gu,ly+86.,dp),vec3(236.,88.,5.));
    if(bb<2.){ float st=viaductD(gu,dp,ly,232.,3.2,0.35); if(st<res){res=st;mat=5.;} }
    else res=min(res,bb);
  }
  // second viaduct spanning the gorge downstream (seen from ours)
  {
    float zb=trackZ(GX)+270., yb=trackY(GX)-4.;
    float v=p.z-zb, lyb=p.y-yb; float gu2=x-(GX-25.*sin(zb/230.));
    float bb=sdBox(vec3(gu2,lyb+86.,v),vec3(254.,88.,5.));
    if(bb<2.){ float st=viaductD(gu2,v,lyb,250.,2.8,1.0); if(st<res){res=st;mat=5.;} }
    else res=min(res,bb);
  }
  // catenary poles (window side)
  if(e<-6. && abs(dp-2.)<4.5 && ly<8.){
    float px=mod(x+10.,55.)-27.5;
    float pole=max(length(vec2(px,dp-3.9))-0.14,abs(ly-3.)-4.);
    float arm=length(vec2(px,ly-6.35))-0.06; arm=max(arm,abs(dp-1.8)-2.2);
    float brace=length(vec2(px,(ly-5.4)-(dp-3.9)*(-0.45)))-0.05; brace=max(brace,abs(dp-2.7)-1.2);
    float pd=min(min(pole,arm),brace);
    if(pd<res){res=pd;mat=6.;}
  }
  return vec2(res,mat);
}

vec3 calcNormal(vec3 p,float t){
  float e=0.0012*t+0.004;
  gOctAdd=2.;
  vec2 k=vec2(1,-1);
  vec3 n=normalize(k.xyy*map(p+k.xyy*e,t).x+k.yyx*map(p+k.yyx*e,t).x+k.yxy*map(p+k.yxy*e,t).x+k.xxx*map(p+k.xxx*e,t).x);
  gOctAdd=0.;
  return n;
}

float march(vec3 ro,vec3 rd,out float mat,float tmax,int maxs){
  float t=0.2; mat=0.; float lastD=1e9;
  for(int i=0;i<400;i++){
    if(i>=maxs) break;
    vec3 p=ro+rd*t;
    if(p.y>4300. && rd.y>0.) break;
    vec2 m=map(p,t); lastD=m.x;
    if(m.x<0.0009*t+0.004){mat=m.y;return t;}
    t+=max(m.x,0.0006*t);
    if(t>tmax) return -1.;
  }
  if(t<tmax && lastD<0.01*t){ mat=1.; return t; }
  // budget exhausted: finish with terrain-only steps
  for(int i=0;i<80;i++){
    vec3 p=ro+rd*t;
    if(p.y>4300. && rd.y>0.) return -1.;
    float h=terrainH(p.xz,6);
    float dd=(p.y-h)*0.5;
    if(dd<0.002*t){ mat=1.; return t; }
    t+=max(dd,0.001*t);
    if(t>tmax) return -1.;
  }
  return -1.;
}

float cloudCover(vec2 q){ return smoothstep(0.48,0.78,fbm4(q/2600.+vec2(uTime*0.0008,0.))); }

float softShadow(vec3 p,vec3 L){
  float res=1.,t=1.5;
  int n=uQ>0.5?44:24;
  for(int i=0;i<44;i++){ if(i>=n)break;
    vec3 q=p+L*t;
    if(q.y>4000.) break;
    float h=q.y-terrainH(q.xz,5);
    res=min(res,10.*h/t);
    if(res<0.005)break;
    t+=clamp(h*0.7,1.+t*0.03,400.);
  }
  float s=smoothstep(0.,1.,res);
  // cloud shadows
  vec3 cq=p+L*((4600.-p.y)/max(L.y,0.05));
  s*=1.-0.65*cloudCover(cq.xz);
  return s;
}

vec3 skyLUT(vec3 rd){
  float u=atan(rd.z,rd.x)/(2.*PI)+.5;
  float y=clamp(rd.y,-1.,1.);
  float v=.5+.5*sign(y)*sqrt(abs(y));
  return texture2D(tSky,vec2(u,v)).rgb;
}

vec4 clouds(vec3 ro,vec3 rd,float tlim){
  if(rd.y<=0.01) return vec4(0.);
  float t0=(4300.-ro.y)/rd.y, t1=(5600.-ro.y)/rd.y;
  if(t0>tlim) return vec4(0.);
  t1=min(t1,t0+18000.);
  int N=uQ>0.5?26:14;
  float dt=(t1-t0)/float(N);
  float T=1.; vec3 acc=vec3(0.);
  float j=hash12(gl_FragCoord.xy);
  for(int i=0;i<26;i++){ if(i>=N)break;
    float tt=t0+dt*(float(i)+j);
    vec3 p=ro+rd*tt;
    float hgt=(p.y-4300.)/1300.;
    float cov=cloudCover(p.xz);
    float den=cov*smoothstep(0.,.2,hgt)*smoothstep(1.,.5,hgt);
    if(den>0.01){
      den*=smoothstep(0.3,0.65,fbm3(p/700.+vec3(uTime*0.01,0.,0.)))*1.6;
      if(den>0.001){
        float dl=cloudCover((p+uSun*400.).xz)*smoothstep(0.3,0.65,fbm3((p+uSun*400.)/700.));
        float lit=exp(-dl*2.2)*(0.7+0.3*hgt);
        vec3 c=uSunCol*lit*0.55*(1.+1.5*pow(max(dot(rd,uSun),0.),6.))+uAmbCol*(0.6+0.5*hgt);
        float a=1.-exp(-den*dt*0.0035);
        acc+=T*a*c; T*=1.-a;
        if(T<0.03)break;
      }
    }
  }
  // fade with distance
  float fade=exp(-max(t0-2000.,0.)*0.000045);
  return vec4(acc*fade,(1.-T)*fade);
}

vec3 fogApply(vec3 col,float t,vec3 ro,vec3 rd){
  float b=1./1300.;
  float c=4.2e-5;
  float y0=max(ro.y-600.,0.);
  float ry=rd.y; if(abs(ry)<1e-4) ry=1e-4;
  float od=c*exp(-y0*b)*(1.-exp(-t*ry*b))/(ry*b);
  float ext=exp(-od);
  vec3 rf=normalize(vec3(rd.x,max(rd.y,0.015),rd.z));
  vec3 ins=skyLUT(rf)*0.85+uSunCol*0.06*pow(max(dot(rd,uSun),0.),6.);
  return col*ext+ins*(1.-ext);
}

float tunnelOpen(vec3 p){
  float x=p.x; float e=tunnelE(x);
  if(e<-2.) return 1.;
  float d=(p.z-trackZ(x)); float ly=p.y-trackY(x);
  if(abs(d)<7. && ly<9.) return 1.-smoothstep(-2.,45.,e);
  return 1.;
}

vec3 lampLight(vec3 p,vec3 n){
  float x=p.x; float e=tunnelE(x);
  if(e<-30.) return vec3(0.);
  float tz=trackZ(x),ty=trackY(x);
  vec3 acc=vec3(0.);
  float base=floor(x/12.)*12.+6.;
  for(int k=-1;k<=1;k++){
    float lx=base+float(k)*12.;
    if(tunnelE(lx)<2.) continue;
    for(int s=0;s<2;s++){
      float side=s==0?-1.:1.;
      vec3 lp=vec3(lx,trackY(lx)+3.2,trackZ(lx)+side*3.9);
      vec3 l=lp-p; float d2=dot(l,l); l*=inversesqrt(d2);
      acc+=vec3(1.,0.66,0.32)*0.5*max(dot(n,l),0.)/(d2+0.5);
    }
  }
  return acc;
}

vec3 shade(vec3 p,vec3 n,vec3 rd,float mat,float t){
  float x=p.x; float tz=trackZ(x),ty=trackY(x); float d=p.z-tz;
  vec3 alb=vec3(0.3); float spec=0.; float ao=1.; vec3 emis=vec3(0.);
  float h=p.y;
  if(mat>2.25&&mat<2.75){
    vec2 cid=floor(p.xz/TCS);
    float cn=noise(p.xz/5.)*0.6+noise(p.xz/1.7)*0.4;
    alb=vec3(0.065,0.10,0.04)*(0.45+1.1*cn);
    alb=mix(alb,vec3(0.09,0.10,0.045),smoothstep(0.6,0.9,noise(p.xz/40.))*0.5);
    ao=0.55+0.45*cn;
  } else if(mat<1.5){
    float s=n.y;
    float nz=fbm4(p.xz/60.);
    float nz2=noise(p.xz/7.);
    vec3 grass=mix(vec3(0.075,0.11,0.03),vec3(0.17,0.19,0.06),nz);
    if(t<400.){ float gd=noise(p.xz*1.7)*0.6+noise(p.xz*6.)*0.4; grass*=0.7+0.6*gd; float fl=step(0.97,hash12(floor(p.xz*9.))); grass=mix(grass,vec3(0.55,0.5,0.3),fl*0.35*(1.-smoothstep(100.,300.,t))); }
    grass=mix(grass,vec3(0.20,0.17,0.08),smoothstep(0.6,0.9,fbm4(p.xz/240.))*0.6);
    float strata=0.5+0.5*sin(p.y*0.045+p.x*0.004+fbm4(p.xz/120.)*9.);
    strata=mix(strata,fbm4(p.xz/25.+p.y*0.02),0.5);
    vec3 rock=mix(vec3(0.16,0.15,0.14),vec3(0.34,0.31,0.27),strata*0.6+nz2*0.4);
    rock=mix(rock,rock*vec3(1.1,0.95,0.8),fbm4(p.xz/400.));
    rock*=0.8+0.4*noise(p.xz/3.+p.y);
    float rk=1.-smoothstep(0.62,0.82,s+0.1*(nz-.5));
    float gw=gorgeK(p.xz); if(gw>0.02){ rock*=0.8+0.4*noise(p.xz/6.+p.y*0.07); rock=mix(rock,rock*vec3(0.85,0.9,0.8),noise(p.xz/12.+p.y*0.1)); }
    float alt=p.y-ty;
    rk=max(rk,smoothstep(1100.,1500.,alt+nz*300.)*(1.-smoothstep(0.85,0.95,s)));
    alb=mix(grass,rock,rk);
    // forest floor / canopy at distance
    float f=forestMask(p.xz,p.y,d,ty);
    if(f>0.01){
      float far=smoothstep(700.,1400.,t);
      vec2 cid=floor(p.xz/TCS);
      float tr=step(hash12(cid),f);
      vec3 can=vec3(0.025,0.045,0.02)*(0.7+0.6*hash12(cid+2.));
      alb=mix(alb,mix(alb*0.6,can,tr*far+(1.-far)*0.),f*(far*0.9+0.4));
      ao*=mix(1.,0.55,f*(1.-far));
    }
    // snow
    float sl=2000.+300.*(nz-.5)*2.;
    float sn=smoothstep(sl-120.,sl+120.,p.y+500.*(s-0.65));
    sn*=smoothstep(0.42,0.68,s);
    alb=mix(alb,vec3(0.86,0.88,0.92),sn);
    spec=sn*0.3;
    // track bed / ballast
    float ad=abs(d);
    if(ad<6. && gorgeK(p.xz)<0.3){
      vec3 bal=vec3(0.15,0.13,0.11)*(0.6+0.8*noise(p.xz*11.));
      float slp=step(0.62,fract(x/0.65))*(1.-smoothstep(1.1,1.3,ad));
      bal=mix(bal,vec3(0.07,0.06,0.05),slp*0.8);
      float rail=1.-smoothstep(0.025,0.045,abs(ad-0.52));
      bal=mix(bal,vec3(0.12,0.115,0.11),rail); spec=rail*0.9;
      alb=mix(alb,bal,1.-smoothstep(2.0,3.2,ad));
    }
    // gorge stream
    float g=gorgeK(p.xz);
    if(g>0.6 && p.y<ty-120.){ float rv=smoothstep(0.88,0.95,g); alb=mix(alb,vec3(0.25,0.32,0.33),rv); spec=0.5*rv;}
    // lake shore
    if(p.y<WATER+1.2 && lakeMask(x)>0.){ alb=mix(alb,vec3(0.13,0.12,0.10),0.8); }
  } else if(mat<2.5){
    vec2 cid=floor(p.xz/TCS);
    alb=vec3(0.05,0.085,0.035)*(0.75+0.5*hash12(cid+2.));
    alb=mix(alb,vec3(0.085,0.095,0.04),hash12(cid+8.)*0.5);
    float gh=terrainH(p.xz,6);
    ao=clamp(0.35+0.65*(p.y-gh)/22.,0.,1.);
    ao*=0.75+0.25*noise(p.xz*3.+p.y*2.);
  } else if(mat<3.5){
    vec2 lq=vec2(x,d); vec2 cid=floor(lq/HCS);
    float gh=terrainH(p.xz,5);
    float ly=p.y-gh;
    vec3 wood=vec3(0.16,0.08,0.035)*(0.8+0.4*noise(vec2(p.y*3.,x+d)));
    vec3 plaster=vec3(0.75,0.72,0.66);
    alb=mix(plaster,wood,smoothstep(2.6,3.,ly+0.6*hash12(cid)));
    // windows
    float wu=fract((x+d)*0.42); float wv=fract(ly*0.36);
    if(wu>0.3&&wu<0.65&&wv>0.25&&wv<0.65&&ly>0.8) { alb=vec3(0.02,0.025,0.03); spec=0.5; if(wv<0.32) alb=vec3(0.45,0.05,0.04);} 
  } else if(mat<4.5){
    alb=vec3(0.11,0.085,0.075)*(0.7+0.5*noise(p.xz*1.5));
  } else if(mat<5.5){
    // stone masonry
    vec2 uv=vec2(x+p.z,p.y)*vec2(1.5,2.5);
    vec2 bid=floor(vec2(uv.x+0.5*floor(uv.y),uv.y));
    vec2 bf=fract(vec2(uv.x+0.5*floor(uv.y),uv.y));
    float mort=smoothstep(0.0,0.08,min(min(bf.x,1.-bf.x),min(bf.y,1.-bf.y)));
    alb=vec3(0.42,0.38,0.33)*(0.7+0.5*hash12(bid))*(0.55+0.45*mort);
    alb*=0.85+0.3*noise(p.xz*0.1+p.y*0.05);
  } else if(mat<6.5){
    alb=vec3(0.18,0.19,0.2); spec=0.4;
  } else if(mat<7.25){
    alb=vec3(0.80,0.78,0.72);
  } else if(mat<7.75){
    alb=vec3(0.12,0.12,0.13); spec=0.3;
  } else if(mat<8.5){
    emis=vec3(1.,0.70,0.38)*9.; alb=vec3(0.);
  } else {
    float ly=p.y-ty;
    alb=vec3(0.10,0.095,0.09)*(0.6+0.7*fbm4(vec2(x*0.6,ly*1.3+d)));
    alb*=0.75+0.25*smoothstep(0.,0.3,abs(fract(x/6.)-.5));
    if(ly<-0.2) alb=vec3(0.09,0.08,0.07)*(0.6+0.8*noise(p.xz*10.));
    spec=0.25*smoothstep(0.6,0.8,noise(vec2(x*0.3,ly*3.)));
  }
  vec3 L=uSun;
  float dif=max(dot(n,L),0.);
  float sh= dif>0.001 ? softShadow(p+n*(0.3+t*0.0008),L) : 0.;
  float open=tunnelOpen(p);
  if(mat>1.5&&mat<2.25){ dif=0.35+0.65*max(dot(n,L),0.)*0.8+0.2*max(dot(-rd,L),0.); dif*=max(dot(n,L)*0.5+0.5,0.);} 
  vec3 sunL=uSunCol*dif*sh*open;
  vec3 skyL=uAmbCol*(0.55+0.45*n.y)*ao*open;
  vec3 bnc=vec3(0.16,0.13,0.08)*0.35*clamp(-n.y*0.5+0.5,0.,1.)*ao*open*length(uSunCol)/3.;
  vec3 lamp=lampLight(p,n);
  vec3 col=alb*(sunL+skyL+bnc+lamp)+emis;
  if(spec>0.){
    vec3 hv=normalize(L-rd);
    col+=uSunCol*sh*open*spec*pow(max(dot(n,hv),0.),40.)*0.6;
  }
  return col;
}

vec3 viewDir(vec2 uv){
  vec4 v=uProjInv*vec4(uv*2.-1.,1.,1.);
  return normalize(v.xyz/v.w);
}

bool windowMask(vec3 o,vec3 dir){
  if(abs(dir.z)<1e-4) return false;
  float zw=dir.z>0.?1.40:-1.40;
  float tw=(zw-o.z)/dir.z;
  if(tw<0.) return false;
  vec3 h=o+dir*tw;
  float k=floor((h.x-0.55)/1.9+0.5);
  if(k<-5.||k>5.) return false;
  float u=h.x-0.55-k*1.9;
  vec2 hs=vec2(0.65+0.07,0.44+0.07);
  float R=0.17;
  vec2 q=abs(vec2(u,h.y-1.27))-hs+R;
  float sd=length(max(q,0.))+min(max(q.x,q.y),0.)-R;
  return sd<0.;
}

vec3 renderSky(vec3 ro,vec3 rd){
  vec3 col=skyLUT(rd);
  float sd=dot(rd,uSun);
  col+=uSunCol*8.*smoothstep(0.99985,0.99993,sd);
  vec4 cl=clouds(ro,rd,1e9);
  col=col*(1.-cl.a)+cl.rgb;
  return col;
}

void main(){
  vec3 vd=viewDir(vUv);
  vec3 lro=uLocalCam[3].xyz;
  vec3 lrd=normalize(mat3(uLocalCam)*vd);
  if(uNoMask<0.5 && !windowMask(lro,lrd)){ gl_FragColor=vec4(0.,0.,0.,-1.); return; }
  vec3 ro=uCamWorld[3].xyz;
  vec3 rd=normalize(mat3(uCamWorld)*vd);
  float mat;
  int ms=uQ>0.5?260:150;
  float t=march(ro,rd,mat,30000.,ms);
  vec3 col; float depth;
  // water
  float tw=-1.;
  if(rd.y<0.){ float tt=(WATER-ro.y)/rd.y; if(tt>0.&&(t<0.||tt<t)){ vec3 pw=ro+rd*tt; if(lakeMask(pw.x)>0.02 && terrainH(pw.xz,8)<WATER-0.2) tw=tt; } }
  if(tw>0. && uDebug>0.5){ gl_FragColor=vec4(0.,.3,.3,tw); return; }
  if(tw>0.){
    vec3 pw=ro+rd*tw;
    vec2 wq=pw.xz*0.08;
    vec3 n1=noised(wq+vec2(uTime*0.15,uTime*0.05));
    vec3 n2=noised(wq*3.1-vec2(uTime*0.25,-uTime*0.1));
    float amp=0.03*exp(-tw*0.003)+0.004;
    vec3 n=normalize(vec3(-(n1.y+0.4*n2.y)*amp,1.,-(n1.z+0.4*n2.z)*amp));
    vec3 R=reflect(rd,n);
    float rm;
    float tr=march(pw+vec3(0.,0.4,0.),R,rm,25000.,uQ>0.5?140:80);
    vec3 rc;
    if(tr>0.){ vec3 pr=pw+R*tr; vec3 nr=calcNormal(pr,tr+tw); rc=shade(pr,nr,R,rm,tr+tw); rc=fogApply(rc,tr,pw,R);} 
    else rc=renderSky(pw,R);
    float F=0.02+0.98*pow(1.-max(dot(-rd,n),0.),5.);
    vec3 body=vec3(0.006,0.018,0.02)*uAmbCol*6.;
    col=mix(body,rc,F*0.9+0.08);
    col+=uSunCol*pow(max(dot(R,uSun),0.),300.)*4.*exp(-tw*0.0012);
    col=fogApply(col,tw,ro,rd);
    depth=tw;
  } else if(t>0.){
    vec3 p=ro+rd*t;
    vec3 n=calcNormal(p,t);
    col=shade(p,n,rd,mat,t);
    if(uDebug>0.5){ vec3 dc=mat<1.5?vec3(.3,0,0):mat<2.25?vec3(0,.3,0):mat<2.75?vec3(0,0,.3):mat<4.5?vec3(.3,.3,0):mat<5.5?vec3(.3):vec3(.3,0,.3); gl_FragColor=vec4(dc*(0.5+0.5*fract(t/200.)),t); return; }
    col=fogApply(col,t,ro,rd);
    vec4 cl=clouds(ro,rd,t);
    col=col*(1.-cl.a)+cl.rgb;
    depth=t;
  } else {
    col=renderSky(ro,rd);
    depth=60000.;
  }
  gl_FragColor=vec4(max(col,0.),depth);
}

<script type="x-shader/x-fragment" id="sky-fs">
precision highp float;
uniform vec3 uSun;
varying vec2 vUv;
#define PI 3.14159265
vec2 rsi(vec3 r0,vec3 rd,float sr){float a=dot(rd,rd),b=2.*dot(rd,r0),c=dot(r0,r0)-sr*sr,d=b*b-4.*a*c;if(d<0.)return vec2(1e5,-1e5);return vec2((-b-sqrt(d))/(2.*a),(-b+sqrt(d))/(2.*a));}
vec3 atmosphere(vec3 r,vec3 r0,vec3 pSun,float iSun,float rPlanet,float rAtmos,vec3 kRlh,float kMie,float shRlh,float shMie,float g){
  vec2 p=rsi(r0,r,rAtmos); if(p.x>p.y) return vec3(0.);
  p.y=min(p.y,rsi(r0,r,rPlanet).x);
  const int IS=24, JS=8;
  float iStep=(p.y-p.x)/float(IS); float iTime=0.;
  vec3 tR=vec3(0.),tM=vec3(0.); float iOdR=0.,iOdM=0.;
  float mu=dot(r,pSun),mumu=mu*mu,gg=g*g;
  float pR=3./(16.*PI)*(1.+mumu);
  float pM=3./(8.*PI)*((1.-gg)*(mumu+1.))/(pow(1.+gg-2.*mu*g,1.5)*(2.+gg));
  for(int i=0;i<IS;i++){
    vec3 iPos=r0+r*(iTime+iStep*.5);
    float iH=length(iPos)-rPlanet;
    float odR=exp(-iH/shRlh)*iStep, odM=exp(-iH/shMie)*iStep;
    iOdR+=odR; iOdM+=odM;
    float jStep=rsi(iPos,pSun,rAtmos).y/float(JS); float jTime=0.,jOdR=0.,jOdM=0.;
    for(int j=0;j<JS;j++){vec3 jPos=iPos+pSun*(jTime+jStep*.5);float jH=length(jPos)-rPlanet;jOdR+=exp(-jH/shRlh)*jStep;jOdM+=exp(-jH/shMie)*jStep;jTime+=jStep;}
    vec3 attn=exp(-(kMie*(iOdM+jOdM)+kRlh*(iOdR+jOdR)));
    tR+=odR*attn; tM+=odM*attn; iTime+=iStep;
  }
  return iSun*(pR*kRlh*tR+pM*kMie*tM);
}
void main(){
  float u=vUv.x, v=vUv.y;
  float phi=(u-.5)*2.*PI;
  float s=(v-.5)*2.; float y=sign(s)*s*s;
  y=max(y,-0.02);
  vec3 rd=normalize(vec3(cos(phi)*sqrt(max(1.-y*y,0.)),y,sin(phi)*sqrt(max(1.-y*y,0.))));
  vec3 c=atmosphere(rd,vec3(0.,6371e3+1400.,0.),uSun,22.,6371e3,6471e3,vec3(5.5e-6,13.0e-6,22.4e-6),21e-6,8e3,1.2e3,0.76);
  gl_FragColor=vec4(c,1.);
}

<script type="x-shader/x-fragment" id="comp-fs">
precision highp float;
uniform sampler2D tOut;
uniform vec2 uOutRes;
uniform mat4 uCamWorld;
uniform mat4 uProjInv;
uniform mat4 uPrevVP;
uniform float uExposure;
uniform float uBlur;
uniform float uTime;
varying vec2 vUv;
vec3 viewDir(vec2 uv){vec4 v=uProjInv*vec4(uv*2.-1.,1.,1.);return normalize(v.xyz/v.w);}
vec2 velAt(vec2 uv,float depth){
  vec3 rd=mat3(uCamWorld)*viewDir(uv);
  vec3 P=uCamWorld[3].xyz+rd*min(depth,40000.);
  vec4 c=uPrevVP*vec4(P,1.);
  vec2 puv=c.xy/c.w*.5+.5;
  return (uv-puv)*uBlur;
}
vec3 aces(vec3 x){const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
void main(){
  vec4 c0=texture2D(tOut,vUv);
  if(c0.a<0.){gl_FragColor=vec4(0.,0.,0.,1.);return;}
  vec2 px=1./uOutRes;
  vec2 vC=velAt(vUv,c0.a);
  vec2 vN=velAt(vUv,3.5);
  float lvN=length(vN/px);
  vec3 col=c0.rgb;
  if(lvN>1.5){
    float lvC=length(vC/px);
    const int N=14;
    vec3 sum=c0.rgb*(1./max(lvC,1.)); float ws=1./max(lvC,1.);
    float j=h12(gl_FragCoord.xy+fract(uTime)*91.)-.5;
    for(int i=0;i<N;i++){
      float f=(float(i)+.5+j)/float(N)-.5;
      vec2 o=vN*f;
      vec4 s=textureLod(tOut,vUv+o,0.);
      if(s.a<0.) continue;
      float lo=length(o/px);
      float lvS=length(velAt(vUv+o,s.a)/px);
      float w;
      if(s.a<c0.a*0.97) w=clamp(1.-lo/(0.5*lvS+0.5),0.,1.)/max(lvS,1.);
      else w=clamp(1.-lo/(0.5*lvC+0.5),0.,1.)/max(lvC,1.);
      sum+=s.rgb*w; ws+=w;
    }
    col=sum/ws;
  }
  // bloom
  vec3 b=textureLod(tOut,vUv,2.).rgb*0.45+textureLod(tOut,vUv,4.).rgb*0.35+textureLod(tOut,vUv,6.).rgb*0.2;
  col+=b*0.045;
  col+=max(b*uExposure-1.2,0.)*0.18/uExposure;
  col*=uExposure;
  col=aces(col);
  col=pow(col,vec3(1./2.2));
  col+=(h12(gl_FragCoord.xy*1.3+uTime)-.5)*0.012;
  gl_FragColor=vec4(col,1.);
}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const TEST = Q.has('test');
const $ = id => document.getElementById(id);
const canvas = $('c');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches;

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
const DPR = Math.min(devicePixelRatio||1, isMobile?2:1.5);
renderer.setPixelRatio(TEST?1:DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
const glInfo = (()=>{ try{ const gl=renderer.getContext(); const e=gl.getExtension('WEBGL_debug_renderer_info'); return e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}catch(e){return '?';} })();
const softwareGL = /swiftshader|llvmpipe|software/i.test(glInfo);

/* ---------- shared track maths (mirrors GLSL) ---------- */
const GX=3700, LOOP=6000, SPEED=22;
const trackZ=x=>140*Math.sin(x/950)+55*Math.sin(x/420+1.3)-200*Math.exp(-(((x-GX)/300)**2));
const trackZd=x=>{const u=(x-GX)/300;return 140/950*Math.cos(x/950)+55/420*Math.cos(x/420+1.3)+200*2*u/300*Math.exp(-u*u);};
const trackY=x=>632+16*Math.sin(x/1400+.5);
const trackYd=x=>16/1400*Math.cos(x/1400+.5);
const tunnelE=x=>Math.max(Math.min(x+500,300-x),Math.min(x-5500,6300-x));
const X0=900;
function camX(t){ let x=X0+SPEED*t; x=((x+200)%LOOP+LOOP)%LOOP-200; return x; }

/* ---------- sun & light colours ---------- */
const sunEl=17*Math.PI/180, sunAz=-0.30;
const SUN=new THREE.Vector3(Math.cos(sunEl)*Math.cos(sunAz),Math.sin(sunEl),Math.cos(sunEl)*Math.sin(sunAz)).normalize();
const SUNCOL=new THREE.Vector3(3.3,2.55,1.75);
const AMBCOL=new THREE.Vector3(0.20,0.29,0.46);

/* ---------- full-screen passes ---------- */
const VS=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const quadGeo=new THREE.PlaneGeometry(2,2);
const orthoCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  const curv=(trackZd(x+5)-trackZd(x-5))/10;
  const roll=-curv*40 + Math.sin(t*2.3)*0.004+Math.sin(t*5.9)*0.0015;
  const pitch=Math.sin(t*1.7)*0.0015;
  const bounce=Math.sin(t*9.7)*0.004+Math.sin(t*3.3)*0.006+Math.exp(-((dist%24))*6)*0.008;
  const lat=Math.sin(t*1.1)*0.01+Math.sin(t*3.7)*0.004;
  const m=new THREE.Matrix4().makeBasis(_T,_Y,_Z);
  const r=new THREE.Matrix4().makeRotationX(roll); const p=new THREE.Matrix4().makeRotationZ(pitch);
  m.multiply(r).multiply(p);
  m.setPosition(x,trackY(x)+1.15+bounce,trackZ(x)+lat);
  out.copy(m); return out;
}
function setLocalCam(cam,t){
  const jit=Math.sin(t*13.1)*0.0012+Math.sin(t*21.7)*0.0007;
  cam.position.set(EYE.x,EYE.y+jit,EYE.z);
  const cp=Math.cos(lookPitch);
  const dir=new THREE.Vector3(Math.sin(lookYaw)*cp,Math.sin(lookPitch),Math.cos(lookYaw)*cp);
  cam.up.set(0,1,0); cam.lookAt(cam.position.clone().add(dir));
  cam.fov= cam.aspect<1 ? Math.min(100, 2*Math.atan(Math.tan(lookFov*Math.PI/360)*Math.min(1.75,1/cam.aspect*0.9))*180/Math.PI) : lookFov; cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
}

/* ---------- exposure ---------- */
const EXP_DAY=1.0, EXP_TUN=6.0;
function darkAt(x){ return clamp((tunnelE(x)+2)/10,0,1); }
function targetExposure(x){ const dark=darkAt(x); return Math.exp(Math.log(EXP_DAY)*(1-dark)+Math.log(EXP_TUN)*dark); }
let exposure=EXP_DAY;
function adaptExposure(dt,t){ const tg=targetExposure(camX(t)); const tau= tg>exposure?1.6:0.9; exposure=Math.exp(Math.log(exposure)+(Math.log(tg)-Math.log(exposure))*(1-Math.exp(-dt/tau))); }
function simulateExposure(t){ exposure=targetExposure(camX(t-12)); for(let s=t-12;s<t;s+=0.05) adaptExposure(0.05,s); }

/* ---------- sizing & dynamic resolution ---------- */
let W=1,H=1,outScale = TEST?1:(isMobile?0.42:0.6), simT=0, fixedT=null, lastFrame=performance.now(), ftEma=16, lastAdj=0;
if(Q.get('scale')) outScale=+Q.get('scale');
function resize(){ W=window.innerWidth; H=window.innerHeight; renderer.setSize(W,H,false); canvas.style.width=W+'px'; canvas.style.height=H+'px'; camera.aspect=W/H; camera.updateProjectionMatrix(); sizeOut(); }
function sizeOut(){ const pr=renderer.getPixelRatio(); const w=Math.max(32,Math.round(W*pr*outScale)), h=Math.max(32,Math.round(H*pr*outScale)); if(outRT.width!==w||outRT.height!==h){ outRT.setSize(w,h); } U.uRes.value.set(w,h); CU.uOutRes.value.set(w,h); }
window.addEventListener('resize',resize);

const camWorld=new THREE.Matrix4(), carM=new THREE.Matrix4(), prevCar=new THREE.Matrix4(), prevCam=new THREE.PerspectiveCamera();
const SHUTTER=1/55;
let lastClackD=0;
function renderFrame(dt){
  const t = fixedT!=null ? fixedT : simT;
  if(fixedT==null) adaptExposure(dt,t);
  const now=performance.now()/1000;
  if(!holdLook && !dragging && pointers.size===0 && lastInput>0 && now-lastInput>IDLE_S){
    const k=1-Math.exp(-dt*1.4); lookYaw+=(DEFAULT_YAW-lookYaw)*k; lookPitch+=(DEFAULT_PITCH-lookPitch)*k; lookFov+=(DEFAULT_FOV-lookFov)*k; }
  setLocalCam(camera,t);
  carMatrix(t,carM);
  camWorld.multiplyMatrices(carM,camera.matrixWorld);
  // previous pose for motion blur (fixed shutter)
  carMatrix(t-SHUTTER,prevCar);
  const pcw=new THREE.Matrix4().multiplyMatrices(prevCar,camera.matrixWorld);
  CU.uPrevVP.value.multiplyMatrices(camera.projectionMatrix,pcw.clone().invert());
  U.uCamWorld.value.copy(camWorld); U.uLocalCam.value.copy(camera.matrixWorld); U.uProjInv.value.copy(camera.projectionMatrixInverse);
  U.uTime.value=t;
  CU.uExposure.value=exposure;
  const x=camX(t); const dark=darkAt(x);
  // interior lighting reacts to outside
  const outsideK=1-dark;
  winL.intensity=1.5*outsideK; winL2.intensity=0.7*outsideK; hemi.intensity=0.25+0.35*outsideK;
  renderer.toneMappingExposure=0.75*Math.pow(exposure/EXP_DAY,0.42);
  GU.uRefl.value=0.006+0.035*dark; GU.uExp.value=renderer.toneMappingExposure;
  if(window.__tunnelGain) window.__tunnelGain.gain.value=0.05+0.06*dark;
  const dd=SPEED*t; if(window.__clack && Math.floor(dd/24)!==lastClackD){ lastClackD=Math.floor(dd/24); window.__clack(); }
  renderer.setRenderTarget(outRT); renderer.render(worldPass.scene,orthoCam);
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(compPass.scene,orthoCam);
  renderer.clearDepth(); renderer.render(scene,camera);
}
function loop(nowMs){
  const dt=Math.min(0.1,(nowMs-lastFrame)/1000); lastFrame=nowMs; simT+=dt;
  renderFrame(dt);
  ftEma=ftEma*0.9+dt*1000*0.1;
  if(!softwareGL && nowMs-lastAdj>600){ lastAdj=nowMs;
    if(ftEma>1000/28 && outScale>0.22){ outScale*=0.88; sizeOut(); }
    else if(ftEma<1000/52 && outScale<1.0){ outScale=Math.min(1,outScale*1.06); sizeOut(); }
    if(outScale<0.3) U.uQ.value=0; }
  requestAnimationFrame(loop);
}

/* ---------- test hooks ---------- */
const SEG={ lake:(900-X0)/SPEED, valley:(1300-X0)/SPEED, village:(2330-X0)/SPEED, forest:(3250-X0)/SPEED, viaduct:(3560-X0)/SPEED,
  portalIn:(5470-X0)/SPEED, tunnel:(5650-X0)/SPEED, portalOut:(6000+300+12-X0)/SPEED, tunnelExit:(6000+300+12-X0)/SPEED };
window.__setT=t=>{ fixedT=t; simulateExposure(t); };
window.__setX=x=>{ window.__setT((x-X0)/SPEED); };
window.__setSegment=n=>{ window.__setT(SEG[n]); };
window.__setLook=(y,p,f)=>{ if(y!=null)lookYaw=y; if(p!=null)lookPitch=p; if(f!=null)lookFov=f; holdLook=true; };
window.__resetLook=()=>{ lookYaw=DEFAULT_YAW; lookPitch=DEFAULT_PITCH; lookFov=DEFAULT_FOV; holdLook=true; };
window.__outsideOnly=v=>{ U.uNoMask.value=v?1:0; scene.visible=!v; };
window.__debug=v=>{U.uDebug.value=v;};
window.__dbgVel=()=>{ const d=new THREE.Vector3(0,0,-1).applyMatrix4(new THREE.Matrix4().extractRotation(camWorld)); const o=new THREE.Vector3().setFromMatrixPosition(camWorld);
  const P=o.clone().add(d.multiplyScalar(3.5)); const a=P.clone().applyMatrix4(CU.uPrevVP.value); const vp=new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camWorld.clone().invert()); const b=P.clone().applyMatrix4(vp); return [a.x,a.y,b.x,b.y,o.x,o.y,o.z]; };
window.__setScale=s=>{ outScale=s; sizeOut(); };
window.__forceRender=()=>{ renderFrame(1/60); renderer.getContext().finish(); };
window.__state=()=>({ t:fixedT??simT, x:camX(fixedT??simT), exposure, outScale, q:U.uQ.value, gl:glInfo, softwareGL, ft:ftEma, W, H, yaw:lookYaw, pitch:lookPitch, fov:lookFov });

resize();
renderer.setRenderTarget(skyRT); renderer.render(skyPass.scene,orthoCam); renderer.setRenderTarget(null);
captureCube();
window.__ready=true;
$('load').classList.add('gone');
setTimeout(()=>$('hint').classList.add('gone'),7000);
if(!TEST) requestAnimationFrame(loop); else { fixedT=0; }
</script>
</body></html>
