<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const $hint = document.getElementById('hint');
const $load = document.getElementById('load');

const R = 240;
const SPEED = 16;
const TAU = Math.PI * 2;
const FLOOR = 1.20;
const CEIL = 3.26;
const WIN_X = 1.32;
const SUN = new THREE.Vector3(0.72, 0.22, 0.66).normalize();

const U = {
  valley: 0.40, forest: 1.08, village: 1.72, lake: 2.48,
  viaduct: 3.28, portalIn: 3.72, tunnel: 4.55, portalOut: 5.22, high: 5.72
};
const TUN_A = 3.88, TUN_B = 5.12;

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const saturate = v=>clamp(v,0,1);
const smooth = (a,b,x)=> { const t=saturate((x-a)/(b-a)); return t*t*(3-2*t); };
const fract = v=>v-Math.floor(v);
const wrapTau = a=> { a%=TAU; return a<0?a+TAU:a; };
const hash2 = (x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453123);
function vnoise(x,y){
  const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),ux), lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),ux), uy);
}
function fbm(x,y,o=5){
  let v=0,a=.5,f=1,s=0;
  for(let i=0;i<o;i++){ v+=a*vnoise(x*f,y*f); s+=a; a*=.5; f*=2.05; }
  return v/s;
}
function ridged(x,y,o=6){
  let v=0,a=0.5,f=1,s=0,prev=1;
  for(let i=0;i<o;i++){
    let n=1-Math.abs(vnoise(x*f,y*f)*2-1);
    n=n*n*prev;
    prev=n;
    v+=n*a; s+=a; a*=0.52; f*=2.12;
  }
  return v/s;
}
function rng(seed){ let s=seed|0||1; return ()=>{ s^=s<<13;s^=s>>>17;s^=s<<5; return ((s>>>0)/4294967296); }; }

const ua = navigator.userAgent||'';
const isMobile = /iPhone|iPad|iPod|Android/i.test(ua) || Math.min(innerWidth,innerHeight)<520;
let softwareGL = false;
let quality = isMobile ? 'med' : 'high';

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
renderer.setClearColor(0x7aa0c8, 1);
renderer.autoClear = true;

(function detectGL(){
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? (gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'') : '';
  softwareGL = /swiftshader|llvmpipe|softpipe|software|microsoft basic render/i.test(name) || !ext;
  if (softwareGL) quality = 'low';
  window.__gl = name || 'unknown';
})();

function applyPixelRatio(){
  const dpr = window.devicePixelRatio || 1;
  const cap = quality==='high' ? 1.5 : quality==='med' ? 1.15 : 0.85;
  renderer.setPixelRatio(Math.min(dpr, cap));
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/Math.max(1,h);
  camera.updateProjectionMatrix();
  if (extRT) {
    const pr = renderer.getPixelRatio();
    extRT.setSize(Math.max(1,Math.floor(w*pr)), Math.max(1,Math.floor(h*pr)));
  }
}
applyPixelRatio();

function makeCanvas(s, fn){
  const c=document.createElement('canvas'); c.width=c.height=s;
  const ctx=c.getContext('2d'); fn(ctx,s);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}
const texWood = makeCanvas(256,(ctx,s)=>{
  for(let y=0;y<s;y++){
    const n=fbm(2,y*0.07,3);
    ctx.fillStyle=`rgb(${110+n*50|0},${70+n*30|0},${38+n*16|0})`;
    ctx.fillRect(0,y,s,1);
  }
  ctx.globalAlpha=.18;
  for(let i=0;i<18;i++){
    const x=hash2(i,2)*s;
    ctx.strokeStyle=`rgb(${60+hash2(i,3)*40|0},${40|0},${20})`;
    ctx.beginPath(); ctx.moveTo(x,0);
    for(let y=0;y<s;y+=4) ctx.lineTo(x+Math.sin(y*.08+i)*6,y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
});
texWood.repeat.set(2,2);

const texFabric = makeCanvas(128,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const n=vnoise(x*.35,y*.35)*22;
    const g=(x+y)%3===0?8:0;
    ctx.fillStyle=`rgb(${118+n-g|0},${32+n*.4|0},${36+n*.3|0})`;
    ctx.fillRect(x,y,1,1);
  }
});

const texCarpet = makeCanvas(128,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const n=vnoise(x*.2,y*.2)*18;
    ctx.fillStyle=`rgb(${72+n|0},${50+n*.6|0},${38+n*.4|0})`;
    ctx.fillRect(x,y,1,1);
  }
});
texCarpet.repeat.set(8,14);

const texMetal = makeCanvas(64,(ctx,s)=>{
  const g=ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#c5c8cc'); g.addColorStop(.5,'#8b9098'); g.addColorStop(1,'#d5d7da');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
});

const texStone = makeCanvas(256,(ctx,s)=>{
  ctx.fillStyle='#8a8074'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<280;i++){
    const x=hash2(i,1)*s, y=hash2(i,2)*s, w=8+hash2(i,3)*26, h=5+hash2(i,4)*14;
    const n=hash2(i,5);
    ctx.fillStyle=`rgb(${100+n*70|0},${90+n*50|0},${75+n*35|0})`;
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(0,0,0,.14)';
    ctx.fillRect(x,y+h-1,w,1);
    ctx.fillStyle='rgba(255,255,255,.06)';
    ctx.fillRect(x,y,w,1);
  }
});
texStone.repeat.set(2,4);

const texRock = makeCanvas(256,(ctx,s)=>{
  for(let y=0;y<s;y++) for(let x=0;x<s;x+=2){
    const n=fbm(x*.04,y*.04,4);
    const r=80+n*80,g=74+n*65,b=68+n*52;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(x,y,2,1);
  }
});
texRock.repeat.set(8,8);

const texBark = makeCanvas(64,(ctx,s)=>{
  for(let y=0;y<s;y++){
    const n=vnoise(1,y*.2)*30;
    ctx.fillStyle=`rgb(${70+n|0},${48+n*.5|0},${30})`;
    ctx.fillRect(0,y,s,1);
  }
  ctx.fillStyle='rgba(0,0,0,.25)';
  for(let i=0;i<8;i++) ctx.fillRect(hash2(i,1)*s,0,2,s);
});

const texNeedle = makeCanvas(64,(ctx,s)=>{
  ctx.fillStyle='#1a3a22'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<320;i++){
    ctx.fillStyle=`rgb(${20+hash2(i,1)*35|0},${55+hash2(i,2)*55|0},${25+hash2(i,3)*22|0})`;
    ctx.fillRect(hash2(i,4)*s,hash2(i,5)*s,1+hash2(i,6)*2,2);
  }
});

const texGlassDirt = makeCanvas(256,(ctx,s)=>{
  ctx.clearRect(0,0,s,s);
  const g=ctx.createRadialGradient(s/2,s/2,s*.32,s/2,s/2,s*.55);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(255,255,255,1)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
});

const texBrick = makeCanvas(128,(ctx,s)=>{
  ctx.fillStyle='#3a3530'; ctx.fillRect(0,0,s,s);
  for(let row=0;row<16;row++){
    const off=(row%2)*8;
    for(let col=0;col<10;col++){
      const n=hash2(row,col);
      ctx.fillStyle=`rgb(${70+n*40|0},${62+n*30|0},${52+n*20|0})`;
      ctx.fillRect(col*14+off+1, row*8+1, 12, 6);
    }
  }
});
texBrick.repeat.set(8,3);

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.FogExp2(0x9bb6c8, 0.0007);

const interiorGroup = new THREE.Group();
interiorGroup.name = 'interior';
const worldGroup = new THREE.Group();
worldGroup.name = 'world';
const trainGroup = new THREE.Group();
trainGroup.name = 'train';

scene.add(worldGroup);
scene.add(trainGroup);
trainGroup.add(interiorGroup);

const camera = new THREE.PerspectiveCamera(54, innerWidth/Math.max(1,innerHeight), 0.08, 5000);
const CAM_LOCAL = new THREE.Vector3(1.08, 2.14, -0.12);
camera.position.copy(CAM_LOCAL);
interiorGroup.add(camera);

// Look out-and-forward so the curve, poles and train ahead can enter the frame.
const DEFAULT_YAW = 0.58;
const DEFAULT_PITCH = -0.13;
const DEFAULT_FOV = 55;
let lookYaw = DEFAULT_YAW, lookPitch = DEFAULT_PITCH, lookFov = DEFAULT_FOV;
let holdLook = false;
let lastInput = 0;
const IDLE_S = 4.0;

const hemi = new THREE.HemisphereLight(0xc5dcf5, 0x8a7a60, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe3b0, 3.1);
sun.position.copy(SUN).multiplyScalar(800);
scene.add(sun);
const sunFill = new THREE.DirectionalLight(0xa8c4e0, 0.28);
sunFill.position.set(-SUN.x, SUN.y*0.5, -SUN.z).multiplyScalar(600);
scene.add(sunFill);

const cabinLight = new THREE.PointLight(0xffd9a8, 1.35, 8, 1.3);
cabinLight.position.set(0, 3.05, -0.2);
interiorGroup.add(cabinLight);
const cabinLight2 = new THREE.PointLight(0xffe6c4, 0.7, 9, 1.5);
cabinLight2.position.set(0, 3.05, 3.6);
interiorGroup.add(cabinLight2);
const cabinLight3 = new THREE.PointLight(0xffe6c4, 0.55, 9, 1.5);
cabinLight3.position.set(0, 3.05, -3.8);
interiorGroup.add(cabinLight3);
const cabinFill = new THREE.PointLight(0xffe0c0, 0.4, 6, 1.6);
cabinFill.position.set(0.2, 2.4, 0);
interiorGroup.add(cabinFill);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { sunDir: { value: SUN.clone() }, tunnel: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sunDir; uniform float tunnel;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
    }
    float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.05; a*=0.55; } return v; }
    void main(){
      vec3 d=normalize(vDir);
      float h=d.y;
      vec3 zenith=vec3(0.16,0.38,0.76);
      vec3 mid=vec3(0.48,0.70,0.90);
      vec3 hor=vec3(0.86,0.78,0.68);
      vec3 warm=vec3(1.0,0.62,0.32);
      vec3 col=mix(hor,mid,smoothstep(-0.06,0.16,h));
      col=mix(col,zenith,smoothstep(0.12,0.75,h));
      col=mix(col,warm, exp(-abs(h-0.01)*9.0)*0.5);
      float mu=max(dot(d,normalize(sunDir)),0.0);
      col+=vec3(1.0,0.93,0.75)*pow(mu, 420.0)*6.0;
      col+=vec3(1.0,0.76,0.42)*pow(mu, 22.0)*0.75;
      col+=vec3(1.0,0.68,0.38)*pow(mu, 5.5)*0.2;
      float py=max(d.y,0.06);
      vec2 cu=d.xz/py*0.55 + vec2(2.1,0.4);
      float cl=fbm(cu);
      cl=smoothstep(0.48,0.78,cl)*smoothstep(0.02,0.18,d.y)*smoothstep(0.82,0.32,d.y);
      col=mix(col, vec3(1.0,0.97,0.94), cl*0.55);
      col=mix(col, vec3(0.015,0.018,0.03), tunnel);
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4200, 32, 20), skyMat);
sky.frustumCulled = false;
scene.add(sky);

function posOnTrack(u, y=0, xLocal=0, yOff=0){
  const phi = -u;
  const inward = new THREE.Vector3(-Math.cos(phi), 0, -Math.sin(phi));
  const forward = new THREE.Vector3(Math.sin(phi), 0, -Math.cos(phi));
  const p = new THREE.Vector3(R*Math.cos(phi), y+yOff, R*Math.sin(phi));
  p.addScaledVector(inward, xLocal);
  return { p, phi, inward, forward, up: new THREE.Vector3(0,1,0) };
}
function applyTrainXform(obj, u, xLocal=0, y=0){
  const { p, inward, forward } = posOnTrack(u, y, xLocal);
  obj.position.copy(p);
  const m = new THREE.Matrix4().makeBasis(inward, new THREE.Vector3(0,1,0), forward);
  obj.quaternion.setFromRotationMatrix(m);
}

function sectorW(u, a, b, fade=0.12){
  u = wrapTau(u);
  if (a < b) {
    if (u>=a && u<=b) return 1;
    const left = (u < a) ? smooth(a-fade,a,u) : 0;
    const right = (u > b) ? smooth(b+fade,b,u) : 0;
    return Math.max(left, right);
  }
  return Math.max(sectorW(u,a,TAU,fade), sectorW(u,0,b,fade));
}
function inTunnelU(u){
  u=wrapTau(u);
  if (u>=TUN_A && u<=TUN_B) {
    const ei = smooth(TUN_A, TUN_A+0.07, u);
    const eo = 1-smooth(TUN_B-0.07, TUN_B, u);
    return Math.min(ei,eo);
  }
  return 0;
}

function heightWorld(x,z){
  const r = Math.hypot(x,z);
  const phi = Math.atan2(z,x);
  const u = wrapTau(-phi);
  const dIn = R - r;
  const dOut = r - R;
  const n1 = fbm(x*0.005, z*0.005, 5);
  const n2 = fbm(x*0.015, z*0.015, 3);
  const ridge = ridged(x*0.0032, z*0.0032, 6);
  let h = 0;

  if (r <= R) {
    // Tight embankment: ballast then a quick drop into the valley so the window
    // is not filled by a flat ledge.
    const shoulder = lerp(0, -0.6-n2, smooth(2.4, 5.5, dIn));
    const drop = lerp(0, -9-3*n1, smooth(5.5, 14, dIn));
    const valley = -8 + 4*n1 + 2*n2;

    const hills = 8 + 28*n1 + 55*ridge;
    const mass =
      210*Math.exp(-((x-15)*(x-15)+(z+10)*(z+10))/(85*85))
      + 170*Math.exp(-((x+70)*(x+70)+(z-55)*(z-55))/(70*70))
      + 150*Math.exp(-((x-60)*(x-60)+(z-70)*(z-70))/(60*60))
      + 110*Math.exp(-((x+20)*(x+20)+(z+90)*(z+90))/(55*55));
    const jag = (ridged(x*0.01,z*0.01,5)-0.4)*mass*0.55;

    if (dIn < 5.5) h = shoulder;
    else if (dIn < 16) h = lerp(shoulder, Math.min(drop, valley), smooth(5.5, 16, dIn));
    else if (dIn < 70) h = lerp(valley, valley + hills*0.35, smooth(16, 70, dIn));
    else h = valley*0.2 + hills + mass + jag;

    // Lake basin close to the track — a real body of water in mid-view
    const lake = sectorW(u, 2.05, 2.88, 0.14) * smooth(3.2, 6.5, dIn) * smooth(180, 95, dIn);
    h = lerp(h, -6.4, saturate(lake*1.2));

    // Village terrace
    const vil = sectorW(u, 1.40, 2.02, 0.1) * smooth(16, 26, dIn) * smooth(95, 50, dIn);
    h = lerp(h, -1.5+1.2*n2, saturate(vil));

    // Gorge under the viaduct: immediate drop
    const gor = sectorW(u, 2.95, 3.62, 0.08);
    const trench = gor * smooth(5.0, 11, dIn) * smooth(170, 70, dIn);
    h = lerp(h, -72 + 5*n2, saturate(trench));
  } else {
    const berm = lerp(0, 1.2+2*n2, smooth(3, 10, dOut));
    const hills = 14 + 50*n1 + 80*ridge;
    const far = smooth(180, 500, dOut);
    const peaks =
      620*Math.exp(-((x-700)*(x-700)+(z-200)*(z-200))/(220*220))
      + 740*Math.exp(-((x-400)*(x-400)+(z+800)*(z+800))/(260*260))
      + 560*Math.exp(-((x+850)*(x+850)+(z+300)*(z+300))/(200*200))
      + 680*Math.exp(-((x+250)*(x+250)+(z-900)*(z-900))/(240*240))
      + 500*Math.exp(-((x-900)*(x-900)+(z-650)*(z-650))/(180*180));
    const jag = (ridged(x*0.0045,z*0.0045,6)-0.35)*peaks*0.5;
    if (dOut < 10) h = berm;
    else if (dOut < 140) h = lerp(berm, hills*0.45, smooth(10, 140, dOut));
    else h = hills*0.5 + (peaks+jag)*far;

    const gor = sectorW(u, 2.95, 3.62, 0.08);
    h = lerp(h, -30, gor*smooth(8, 18, dOut)*smooth(80, 30, dOut)*0.4);
  }

  // Tunnel mass hugs the portal — does not precede it and fill the window
  const tun = sectorW(u, TUN_A+0.005, TUN_B-0.005, 0.02);
  if (tun>0) {
    if (Math.abs(r-R)>5.0) {
      const roof = 70 + 30*n1 + 45*Math.exp(-((r-R)*(r-R))/(55*55));
      h = Math.max(h, lerp(h, roof, tun*smooth(5.0, 14, Math.abs(r-R))));
    } else {
      h = 0;
    }
  }
  return h;
}

function makeTerrMat(){
  const mat = new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.92, metalness:0.0, envMapIntensity:0.12
  });
  mat.onBeforeCompile = (shader)=>{
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <fog_fragment>',
      `
      float dist = length(vViewPosition);
      float haze = 1.0 - exp(-dist * 0.00085);
      haze = clamp(haze, 0.0, 0.85);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.61, 0.73, 0.84), haze);
      #include <fog_fragment>
      `
    );
  };
  return mat;
}

function buildTerrainBand(r0, r1, nR, nT, skipTunnelCut){
  const g = new THREE.BufferGeometry();
  const pos=[], col=[], idx=[];
  const snowLine = 55;
  for (let i=0;i<=nT;i++){
    const phi = i/nT*TAU;
    const ct=Math.cos(phi), st=Math.sin(phi);
    const u=wrapTau(-phi);
    for (let j=0;j<=nR;j++){
      const rr=lerp(r0,r1,j/nR);
      const x=rr*ct, z=rr*st;
      let y=heightWorld(x,z);
      if (skipTunnelCut && inTunnelU(u)>0.2 && Math.abs(rr-R)<5.2){
        y = 0;
      }
      pos.push(x,y,z);
      const n=fbm(x*0.012,z*0.012,3);
      let rC,gC,bC;
      if (y < -5.5) { rC=0.42+n*.06; gC=0.44; bC=0.32; }
      else if (y < 1.2 && Math.abs(rr-R)<8) { rC=0.36+n*.08; gC=0.33; bC=0.26; } // ballast
      else if (y > snowLine + 10 + n*20) { rC=0.90+n*.06; gC=0.93+n*.04; bC=0.96; }
      else if (y > snowLine - 15) {
        const k=smooth(snowLine-15, snowLine+25, y);
        rC=lerp(0.38+n*.08, 0.90, k); gC=lerp(0.36+n*.05, 0.93, k); bC=lerp(0.28, 0.96, k);
      } else {
        rC=0.20+n*.07; gC=0.30+n*.10; bC=0.13+n*.03;
        if (y>30){ rC=lerp(rC,0.45,0.45); gC=lerp(gC,0.43,0.45); bC=lerp(bC,0.38,0.45); }
      }
      if (sectorW(u,0.0,0.8,0.2)>0.3 && y<20 && y>-4){
        gC=Math.min(0.40,gC+0.06); rC*=0.92;
      }
      col.push(rC,gC,bC);
    }
  }
  const w=nR+1;
  for(let i=0;i<nT;i++){
    for(let j=0;j<nR;j++){
      const a=i*w+j, b=a+1, c=a+w, d=c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const nrm=g.getAttribute('normal');
  const clr=g.getAttribute('color');
  const p=g.getAttribute('position');
  for(let i=0;i<p.count;i++){
    const y=p.getY(i), ny=nrm.getY(i);
    // snow on upward faces above the snow line; rock on steep faces
    if (y>40 && ny>0.42){
      const k=saturate((y-40)/50)*saturate((ny-0.42)/0.35);
      clr.setXYZ(i, lerp(clr.getX(i),0.93,k), lerp(clr.getY(i),0.95,k), lerp(clr.getZ(i),0.97,k));
    } else if (ny<0.45 && y>15){
      const k=saturate((0.45-ny)/0.35);
      clr.setXYZ(i, lerp(clr.getX(i),0.40,k), lerp(clr.getY(i),0.36,k), lerp(clr.getZ(i),0.32,k));
    }
  }
  clr.needsUpdate=true;
  return g;
}

(function buildLake(){
  const shape=new THREE.Shape();
  const samples=96;
  let first=true;
  for(let i=0;i<=samples;i++){
    const u=lerp(2.06, 2.90, i/samples);
    const phi=-u;
    const r1=R-6;
    const x=r1*Math.cos(phi), z=r1*Math.sin(phi);
    if(first){ shape.moveTo(x,z); first=false; } else shape.lineTo(x,z);
  }
  for(let i=samples;i>=0;i--){
    const u=lerp(2.06, 2.90, i/samples);
    const phi=-u;
    const r2=Math.max(28, R-150 + 18*Math.sin(i*0.35));
    shape.lineTo(r2*Math.cos(phi), r2*Math.sin(phi));
  }
  const geo=new THREE.ShapeGeometry(shape, 12);
  geo.rotateX(-Math.PI/2);
  geo.translate(0, -6.05, 0);
  const mat=new THREE.ShaderMaterial({
    uniforms:{ sunDir:{value:SUN.clone()}, time:{value:0} },
    vertexShader:`varying vec3 vW; varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vW; varying vec3 vN; uniform vec3 sunDir; uniform float time;
      void main(){
        vec3 N=vec3(0.0,1.0,0.0);
        vec3 V=normalize(cameraPosition-vW);
        float F=pow(1.0-max(dot(V,N),0.0), 2.6);
        vec3 deep=vec3(0.04,0.20,0.28);
        vec3 shallow=vec3(0.16,0.50,0.55);
        float shore=smoothstep(0.0, 40.0, min(length(vW.xz)-30.0, 80.0));
        vec3 col=mix(shallow, deep, 0.45+0.35*shore);
        vec3 skyC=vec3(0.55,0.72,0.90);
        vec3 peakC=vec3(0.70,0.76,0.82);
        vec3 Rdir=reflect(-V,N);
        vec3 env=mix(skyC, peakC, smoothstep(-0.05,0.45,Rdir.y));
        vec3 sunC=vec3(1.0,0.88,0.6);
        float spec=pow(max(dot(reflect(-sunDir,N),V),0.0), 120.0);
        col=mix(col, env, F*0.88);
        col+=sunC*spec*0.85;
        float haze=1.0-exp(-length(vW-cameraPosition)*0.0007);
        col=mix(col,vec3(0.62,0.73,0.84),haze*0.55);
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const lake=new THREE.Mesh(geo,mat);
  worldGroup.add(lake);
  window.__lakeMat=mat;
})();

function mergeGeos(geos){
  let n=0;
  geos.forEach(g=>{ n+=g.attributes.position.count; });
  const pos=new Float32Array(n*3), nrm=new Float32Array(n*3), uv=new Float32Array(n*2);
  const idx=[];
  let bo=0;
  geos.forEach(g=>{
    const p=g.attributes.position, nn=g.attributes.normal, u=g.attributes.uv;
    for(let i=0;i<p.count;i++){
      pos[(bo+i)*3]=p.getX(i); pos[(bo+i)*3+1]=p.getY(i); pos[(bo+i)*3+2]=p.getZ(i);
      if(nn){ nrm[(bo+i)*3]=nn.getX(i); nrm[(bo+i)*3+1]=nn.getY(i); nrm[(bo+i)*3+2]=nn.getZ(i); }
      if(u){ uv[(bo+i)*2]=u.getX(i); uv[(bo+i)*2+1]=u.getY(i); }
    }
    if(g.index){ for(let i=0;i<g.index.count;i++) idx.push(g.index.getX(i)+bo); }
    else { for(let i=0;i<p.count;i++) idx.push(bo+i); }
    bo+=p.count;
  });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm,3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
function makePineGeo(snowy, seed){
  const rnd=rng(seed);
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.20,2.4,6), new THREE.MeshStandardMaterial({ map:texBark, color:0x6a4a32, roughness:0.95 }));
  trunk.position.y=1.2; g.add(trunk);
  const needle=new THREE.MeshStandardMaterial({ map:texNeedle, color: snowy?0x8aa090:0x2a5530, roughness:0.88 });
  const snowM=new THREE.MeshStandardMaterial({ color:0xeff4f8, roughness:0.78 });
  const layers=5;
  for(let i=0;i<layers;i++){
    const t=i/(layers-1);
    const rad=(2.15-t*1.55)*(0.9+rnd()*0.2);
    const hgt=(1.65-t*0.12)*(0.92+rnd()*0.16);
    const y=1.45+i*0.82;
    const cone=new THREE.Mesh(new THREE.ConeGeometry(rad,hgt,7), needle);
    cone.position.set((rnd()-0.5)*0.22, y, (rnd()-0.5)*0.22);
    cone.rotation.y=rnd()*TAU;
    cone.rotation.z=(rnd()-0.5)*0.08;
    g.add(cone);
    if(snowy){
      const cap=new THREE.Mesh(new THREE.ConeGeometry(rad*0.7,hgt*0.26,7), snowM);
      cap.position.set(cone.position.x, y+hgt*0.28, cone.position.z);
      g.add(cap);
    }
  }
  g.updateMatrixWorld(true);
  const all=[];
  g.traverse(ch=>{ if(ch.isMesh){ const gg=ch.geometry.clone(); ch.updateWorldMatrix(true,false); gg.applyMatrix4(ch.matrixWorld); all.push(gg);} });
  return mergeGeos(all);
}

(function placeCandidates(){
  const rnd=rng(42);
  // dense near-track belt (parallax) on forest + general slopes
  for(let i=0;i<900;i++){
    const u = (i<500) ? (0.55+rnd()*1.0) : rnd()*TAU;
    const xLocal = 12+rnd()*32; // inward, close but not filling the glass
    if (sectorW(u,2.05,2.88,0.08)>0.5) continue; // lake
    if (sectorW(u,2.94,3.64,0.08)>0.2) continue; // gorge
    if (inTunnelU(u)>0.1) continue;
    const tt=posOnTrack(u,0,xLocal);
    const y=heightWorld(tt.p.x, tt.p.z);
    if (y<-2 || y>90) continue;
    const hx=heightWorld(tt.p.x+2,tt.p.z), hz=heightWorld(tt.p.x,tt.p.z+2);
    if (Math.hypot(hx-y,hz-y)/2>0.9) continue;
    treeCandidates.push({u, xLocal, y, snowy:y>48 && rnd()<0.4, sc:0.45+rnd()*0.85, rot:rnd()*TAU, near:true, tint:1.05+rnd()*0.35});
  }
  // mid / slope forests both sides
  for(let i=0;i<2200;i++){
    const u=rnd()*TAU;
    const side=rnd()<0.7?1:-1;
    const xLocal = side*(22+rnd()*160);
    if (inTunnelU(u)>0.12 && Math.abs(xLocal)<55) continue;
    if (sectorW(u,2.94,3.64,0.1)>0.2 && xLocal>6) continue;
    if (sectorW(u,2.05,2.88,0.1)>0.45 && xLocal>10 && xLocal<160) continue;
    const tt=posOnTrack(u,0,xLocal);
    const y=heightWorld(tt.p.x, tt.p.z);
    if (y<-2 || y>220) continue;
    const hx=heightWorld(tt.p.x+2,tt.p.z), hz=heightWorld(tt.p.x,tt.p.z+2);
    if (Math.hypot(hx-y,hz-y)/2>0.85) continue;
    if (Math.abs(Math.hypot(tt.p.x,tt.p.z)-R)<8) continue;
    const snowy = y>50 || (y>35 && rnd()<0.35);
    const sc=0.7+rnd()*1.7 + (Math.abs(xLocal)>80?0.8:0);
    treeCandidates.push({u, xLocal, y, snowy, sc, rot:rnd()*TAU, near:false, tint:0.8+rnd()*0.4});
  }
})();

function addChalet(x,y,z, rot, scale, seed){
  const rnd=rng(seed);
  const g=new THREE.Group();
  const bodyW=6.2*scale, bodyD=8.4*scale, bodyH=4.2*scale;
  const plaster=new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.08,0.22,0.68+rnd()*0.12), roughness:0.9 });
  const wood=new THREE.MeshStandardMaterial({ map:texWood, color:0xc9a07a, roughness:0.85 });
  const body=new THREE.Mesh(new THREE.BoxGeometry(bodyW,bodyH,bodyD), rnd()<0.55?plaster:wood);
  body.position.y=bodyH/2; g.add(body);
  const rw=bodyW+1.6*scale, rd=bodyD+1.8*scale, rh=3.4*scale;
  const roofMat=new THREE.MeshStandardMaterial({ color:0x5a3a28, roughness:0.82, map:texWood });
  const snowRoof=new THREE.MeshStandardMaterial({ color:0xf2f6fa, roughness:0.78 });
  const hw=rw/2;
  const slant=Math.atan2(rh, hw);
  const len=Math.hypot(rh,hw);
  for(const s of [-1,1]){
    const slab=new THREE.Mesh(new THREE.BoxGeometry(len, 0.18, rd), roofMat);
    slab.position.set(s*hw*0.5, bodyH+rh*0.5, 0);
    slab.rotation.z = s*slant;
    g.add(slab);
    const snow=new THREE.Mesh(new THREE.BoxGeometry(len*0.95, 0.22, rd*0.92), snowRoof);
    snow.position.set(s*hw*0.5, bodyH+rh*0.5+0.18, 0);
    snow.rotation.z=s*slant;
    g.add(snow);
  }
  for(const s of [-1,1]){
    const shp=new THREE.Shape();
    shp.moveTo(-bodyW/2,0); shp.lineTo(bodyW/2,0); shp.lineTo(0,rh);
    const gg=new THREE.Mesh(new THREE.ShapeGeometry(shp), wood);
    gg.position.set(0,bodyH, s*bodyD/2);
    if(s<0) gg.rotation.y=Math.PI;
    g.add(gg);
  }
  const win=new THREE.MeshStandardMaterial({ color:0x1a1208, emissive:0xffc878, emissiveIntensity:0.85, roughness:0.4 });
  const shut=new THREE.MeshStandardMaterial({ color:0x2e5a38, roughness:0.8 });
  const nW=2+((seed+3)%2);
  for(let i=0;i<nW;i++){
    const zOff=(i-(nW-1)/2)*1.8*scale;
    const w=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.9*scale,0.7*scale), win);
    w.position.set(bodyW/2+0.04, 1.7*scale, zOff); g.add(w);
    for(const k of [-1,1]){
      const sh=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.95*scale,0.22*scale), shut);
      sh.position.set(bodyW/2+0.05, 1.7*scale, zOff+k*0.5*scale); g.add(sh);
    }
  }
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.6*scale,0.8*scale), new THREE.MeshStandardMaterial({map:texWood, color:0x5a3a22, roughness:0.8}));
  door.position.set(bodyW/2+0.03, 0.8*scale, 0); g.add(door);
  const ch=new THREE.Mesh(new THREE.BoxGeometry(0.6*scale,1.8*scale,0.6*scale), new THREE.MeshStandardMaterial({color:0x8a6048, roughness:0.9}));
  ch.position.set(-bodyW*0.2, bodyH+rh*0.35+0.9*scale, bodyD*0.2); g.add(ch);
  g.position.set(x,y,z);
  g.rotation.y=rot;
  worldGroup.add(g);
  return g;
}

(function placeVillage(){
  const rnd=rng(99);
  for(let i=0;i<12;i++){
    const u=1.42 + (i/11)*0.52 + (rnd()-0.5)*0.025;
    const xLocal=30+rnd()*48 + (i%3)*8;
    const t=posOnTrack(u,0,xLocal);
    let y=heightWorld(t.p.x,t.p.z);
    if(y<-4) y=-1.2;
    const rot=Math.atan2(t.p.x,t.p.z)+Math.PI+ (rnd()-0.5)*0.5;
    addChalet(t.p.x, y, t.p.z, rot, 0.48+rnd()*0.28, 200+i*17);
  }
  const t=posOnTrack(1.68,0,52);
  const y=Math.max(heightWorld(t.p.x,t.p.z), -1);
  addChurch(t.p.x, y, t.p.z, Math.atan2(-t.inward.x, -t.inward.z)+Math.PI);
})();

function roundedRectShape(w,h,r){
  const s=new THREE.Shape();
  const hw=w/2, hh=h/2;
  s.moveTo(-hw+r,-hh);
  s.lineTo(hw-r,-hh); s.quadraticCurveTo(hw,-hh,hw,-hh+r);
  s.lineTo(hw,hh-r); s.quadraticCurveTo(hw,hh,hw-r,hh);
  s.lineTo(-hw+r,hh); s.quadraticCurveTo(-hw,hh,-hw,hh-r);
  s.lineTo(-hw,-hh+r); s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);
  return s;
}

function buildInterior(){

  roof.rotation.z=Math.PI/2; roof.rotation.y=Math.PI/2; roof.position.y=CEIL+0.05; g.add(roof);

  const winH0=1.50, winH1=3.18, winH=winH1-winH0;
  const bays=[
    {z:-4.4, w:2.5},
    {z:0.35, w:4.4}, // main bay, extended forward for the default out-and-forward look
    {z:4.85, w:2.4}
  ];

  function addGlass(xSide, mid, span, h){
    const glass=new THREE.Mesh(
      new THREE.PlaneGeometry(span-0.1, h-0.06),
      new THREE.MeshPhysicalMaterial({
        color:0xcfe6f4, metalness:0.1, roughness:0.04,
        transparent:true, opacity:0.11, side:THREE.DoubleSide,
        envMapIntensity:1.2, clearcoat:1, clearcoatRoughness:0.04
      })
    );
    glass.position.set(xSide*(HW+0.01), (winH0+winH1)/2, mid);
    glass.rotation.y = xSide>0 ? Math.PI/2 : -Math.PI/2;
    glass.renderOrder=2;
    glass.userData.isGlass=true;
    g.add(glass);
    const dirt=new THREE.Mesh(new THREE.PlaneGeometry(span-0.1, h-0.06), new THREE.MeshBasicMaterial({
      map:texGlassDirt, transparent:true, opacity:0.10, depthWrite:false, side:THREE.DoubleSide, color:0xc8d0d4
    }));
    dirt.position.copy(glass.position);
    dirt.position.x += xSide*0.005;
    dirt.rotation.y=glass.rotation.y;
    dirt.renderOrder=3;
    g.add(dirt);
  }

  function wallWithWindows(xSide, baysOn){
    const zEdges=[-LEN/2];
    const holes=[];
    if(baysOn){
      for(const b of bays){ holes.push({z0:b.z-b.w/2, z1:b.z+b.w/2}); zEdges.push(b.z-b.w/2, b.z+b.w/2); }
    }
    zEdges.push(LEN/2);
    zEdges.sort((a,b)=>a-b);
    for(let i=0;i<zEdges.length-1;i++){
      const z0=zEdges[i], z1=zEdges[i+1], mid=(z0+z1)/2, span=z1-z0;
      if(span<0.04) continue;
      const isHole = baysOn && holes.some(h=>Math.abs(mid-(h.z0+h.z1)/2)<0.05 && span<h.z1-h.z0+0.05);
      if(isHole){
        const sill=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.12,span), wood);
        sill.position.set(xSide*(HW-0.02), winH0, mid); g.add(sill);
        const lin=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.10,span), wood);
        lin.position.set(xSide*(HW-0.02), winH1, mid); g.add(lin);
        const below=new THREE.Mesh(new THREE.BoxGeometry(0.09, winH0-FLOOR, span), paint);
        below.position.set(xSide*HW, (FLOOR+winH0)/2, mid); g.add(below);
        const belowOut=new THREE.Mesh(new THREE.BoxGeometry(0.09, winH0-FLOOR, span), paintOut);
        belowOut.position.set(xSide*(HW+0.06), (FLOOR+winH0)/2, mid); g.add(belowOut);
        const above=new THREE.Mesh(new THREE.BoxGeometry(0.09, CEIL-winH1, span), paint);
        above.position.set(xSide*HW, (CEIL+winH1)/2, mid); g.add(above);
        const aboveOut=new THREE.Mesh(new THREE.BoxGeometry(0.09, CEIL-winH1, span), paintOut);
        aboveOut.position.set(xSide*(HW+0.06), (CEIL+winH1)/2, mid); g.add(aboveOut);
        // rounded frame as a thin extruded ring
        const outer=roundedRectShape(span-0.02, winH+0.08, 0.16);
        const inner=roundedRectShape(span-0.16, winH-0.08, 0.10);
        outer.holes.push(inner);
        const fr=new THREE.Mesh(new THREE.ExtrudeGeometry(outer, {depth:0.08, bevelEnabled:false}), frame);
        fr.position.set(xSide*(HW-0.02), (winH0+winH1)/2, mid);
        fr.rotation.y = xSide>0 ? Math.PI/2 : -Math.PI/2;
        fr.rotation.z = xSide>0 ? 0 : 0;
        // Extrude is in XY; after rot Y the frame stands in the wall plane.
        if(xSide>0){ fr.rotation.set(0, Math.PI/2, 0); }
        else { fr.rotation.set(0, -Math.PI/2, 0); }
        g.add(fr);
        const left=new THREE.Mesh(new THREE.BoxGeometry(0.1, winH+0.1, 0.1), frame);
        left.position.set(xSide*(HW-0.01), (winH0+winH1)/2, z0+0.05); g.add(left);
        const right=left.clone(); right.position.z=z1-0.05; g.add(right);
        addGlass(xSide, mid, span, winH);
        // curtains at the sides of the opening
        for(const side of [-1,1]){
          const cu=new THREE.Mesh(new THREE.BoxGeometry(0.06, winH*0.92, 0.28), curtainM);
          cu.position.set(xSide*(HW-0.08), (winH0+winH1)/2 - 0.04, mid + side*(span/2-0.18));

        const panel=new THREE.Mesh(new THREE.BoxGeometry(0.1, CEIL-FLOOR, span), paint);
        panel.position.set(xSide*HW, (FLOOR+CEIL)/2, mid); g.add(panel);
        const out=new THREE.Mesh(new THREE.BoxGeometry(0.1, CEIL-FLOOR+0.1, span), paintOut);

        wain.position.set(xSide*(HW-0.06), FLOOR+0.45, mid); g.add(wain);
      }
    }
  }
  wallWithWindows(+1, true);
  wallWithWindows(-1, true);

  for(const s of [-1,1]){
    const end=new THREE.Mesh(new THREE.BoxGeometry(WID, CEIL-FLOOR, 0.1), paint);
    end.position.set(0, (FLOOR+CEIL)/2, s*LEN/2); g.add(end);

  const case1=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.22,0.72), new THREE.MeshStandardMaterial({color:0x3a4a3c, roughness:0.7}));
  case1.position.set(0.85, 3.02, 1.4); g.add(case1);
  const case2=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.16,0.55), new THREE.MeshStandardMaterial({color:0x5a3040, roughness:0.7}));
  case2.position.set(0.80, 2.98, -1.6); g.add(case2);

  const lampM=new THREE.MeshStandardMaterial({ color:0xfff4dc, emissive:0xffe8b0, emissiveIntensity:2.4, roughness:1 });
  for(const z of [-6,-3.2,-0.4,2.4,5.2]){
    const ring=new THREE.Mesh(new THREE.CircleGeometry(0.16,16), lampM);
    ring.rotation.x=Math.PI/2; ring.position.set(0, CEIL-0.05, z); g.add(ring);
  }

  const vent=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.04,LEN-0.6), new THREE.MeshStandardMaterial({color:0xddd6cb, roughness:0.7}));
  vent.position.set(0, CEIL-0.06, 0); g.add(vent);

  const grill=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.22,3.6), metal);
  grill.position.set(HW-0.16, FLOOR+0.22, 0.2); g.add(grill);

  const dk=new THREE.MeshStandardMaterial({color:0x1c1c20, metalness:0.5, roughness:0.45});
  for(const z of [-5.0, 5.0]){
    const bog=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.28,3.0), dk);
    bog.position.set(0, 0.42, z); g.add(bog);
    for(const wz of [-0.9,0.9]) for(const wx of [-0.85,0.85]){
      const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.22,12), new THREE.MeshStandardMaterial({color:0x2a2a2e, metalness:0.75, roughness:0.3}));
      wh.rotation.z=Math.PI/2; wh.position.set(wx,0.42,z+wz); g.add(wh);
    }
  }

  const gold=new THREE.MeshStandardMaterial({ color:0xc4a35a, metalness:0.55, roughness:0.4 });
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(WID+0.2,0.12,LEN+0.05), gold);
  stripe.position.set(0, FLOOR+0.45, 0); g.add(stripe);

  const tunnelFill=new THREE.PointLight(0xffe0b0, 0.0, 16, 1.2);
  tunnelFill.position.set(1.0, 2.3, 0.6);
  tunnelFill.name="tunnelFill";
  g.add(tunnelFill);
}
buildInterior();

const cubeCam = new THREE.CubeCamera(0.15, 14, new THREE.WebGLCubeRenderTarget(quality==='low'?64:128, {
  colorSpace: THREE.SRGBColorSpace
}));
cubeCam.position.set(0.25, 2.2, -0.1);
interiorGroup.add(cubeCam);
let glassMats=[];
interiorGroup.traverse(o=>{ if(o.userData.isGlass) glassMats.push(o.material); });
glassMats.forEach(m=> m.envMap = cubeCam.renderTarget.texture);

const extRT = new THREE.WebGLRenderTarget(4,4, {
  minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, colorSpace:THREE.SRGBColorSpace,
  depthBuffer:true
});
extRT.depthTexture = new THREE.DepthTexture();
extRT.depthTexture.type = THREE.UnsignedIntType;

const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null },
    tDepth: { value: null },
    blurAmt: { value: 0.7 },
    res: { value: new THREE.Vector2(1,1) },
    camNear: { value: 0.08 },
    camFar: { value: 5000 },
    exposureBoost: { value: 1 },
    bloom: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform sampler2D tDepth;
    uniform float blurAmt, camNear, camFar, exposureBoost, bloom;
    uniform vec2 res;
    float viewZ(float d){
      float z=d*2.0-1.0;
      return (2.0*camNear*camFar)/(camFar+camNear-z*(camFar-camNear));
    }
    void main(){
      vec2 uv=vUv;
      float depth=texture2D(tDepth, uv).x;
      float z=viewZ(depth);
      // Interior (< ~2.4m) stays sharp; near exterior (poles, trees, lamps) streaks; far peaks barely.
      float nearW=smoothstep(2.3, 7.0, z) * (1.0-smoothstep(35.0, 140.0, z));
      float amt=blurAmt*nearW;
      vec2 dir=vec2(1.0, 0.22)/res; // along the window, slightly diagonal
      vec3 acc=texture2D(tDiffuse, uv).rgb;
      float wsum=1.0;
      if(amt>0.02){
        for(int i=1;i<=5;i++){
          float fi=float(i);
          float w=1.0-fi/6.0;
          vec2 off=dir*fi*amt*22.0;
          acc+=texture2D(tDiffuse, uv+off).rgb*w;
          acc+=texture2D(tDiffuse, uv-off).rgb*w;
          wsum+=2.0*w;
        }
        acc/=wsum;
      }
      acc*=exposureBoost;
      if(bloom>0.01){
        vec3 bright=max(acc-vec3(0.72), vec3(0.0));
        acc+=bright*bloom*1.6;
      }
      vec2 vc=uv*2.0-1.0;
      acc*=1.0-dot(vc,vc)*0.16;
      float g=fract(sin(dot(uv,vec2(12.9898,78.233)))*43758.5453);
      acc+=(g-0.5)*0.02;
      gl_FragColor=vec4(acc,1.0);
    }`
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postScene.add(postQuad);

function updateMoving(u){
  const sSpacing=0.7;
  const base=u*R;
  const start=Math.floor((base-SLEEPER_N*sSpacing*0.45)/sSpacing);
  for(let i=0;i<SLEEPER_N;i++){
    const dist= (start+i)*sSpacing;
    const uu=wrapTau(dist/R);
    const {p,inward,forward}=posOnTrack(uu,0,0);
    _p.copy(p); _p.y=-0.02;
    _q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(inward,new THREE.Vector3(0,1,0),forward));
    _m.compose(_p,_q,_s);
    sleepers.setMatrixAt(i,_m);
  }
  sleepers.instanceMatrix.needsUpdate=true;

  const pSp=32;
  const pStart=Math.floor((base-POLE_N*pSp*0.4)/pSp);
  for(let i=0;i<POLE_N;i++){
    const dist=(pStart+i)*pSp;
    const uu=wrapTau(dist/R);
    const hide=inTunnelU(uu)>0.25 || sectorW(uu,2.95,3.62,0.04)>0.85;
    const {inward,forward}=posOnTrack(uu,0,0);
    // inward side close to the window (strong parallax), plus outward masts
    const side = (i%2===0) ? 3.9 : -3.5;
    const tt=posOnTrack(uu,0, side);
    _p.copy(tt.p); _p.y = hide? -30 : Math.max(0, heightWorld(tt.p.x,tt.p.z));
    _q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(inward,new THREE.Vector3(0,1,0),forward));
    const sc= hide? new THREE.Vector3(0,0,0): _s;
    _m.compose(_p,_q, sc);
    poles.setMatrixAt(i,_m);
    const armP=_p.clone(); armP.y+=7.15; armP.addScaledVector(inward, side>0? -0.9: 0.9);
    _m.compose(armP,_q, sc);
    arms.setMatrixAt(i,_m);
  }
  poles.instanceMatrix.needsUpdate=true;
  arms.instanceMatrix.needsUpdate=true;

  const scored=treeCandidates.map(c=>{
    let d=Math.abs(wrapTau(c.u-u));
    if(d>Math.PI) d=TAU-d;
    // prefer near-track trees slightly
    return { d: d - (c.near?0.02:0), c };
  }).sort((a,b)=>a.d-b.d);

  let gi=0, si=0;
  const usedG=pines.count, usedS=snowPines.count;
  const col=new THREE.Color();
  for(const it of scored){
    const c=it.c;
    const tt=posOnTrack(c.u,0,c.xLocal);
    _p.set(tt.p.x, c.y, tt.p.z);
    _q.setFromAxisAngle(new THREE.Vector3(0,1,0), c.rot);
    const sc=new THREE.Vector3(c.sc,c.sc,c.sc);
    _m.compose(_p,_q,sc);
    if(c.snowy){
      if(si<usedS){ snowPines.setMatrixAt(si++,_m); }
    } else if(gi<usedG){
      pines.setMatrixAt(gi,_m);
      const t=c.tint||1;
      col.setRGB(0.22*t, 0.38*t, 0.18*t);
      if(pines.setColorAt) pines.setColorAt(gi, col);
      gi++;
    }
    if(gi>=usedG && si>=usedS) break;
  }
  const zero=new THREE.Vector3(0,0,0);
  while(gi<usedG){ _m.compose(new THREE.Vector3(0,-80,0),_q,zero); pines.setMatrixAt(gi++,_m); }
  while(si<usedS){ _m.compose(new THREE.Vector3(0,-80,0),_q,zero); snowPines.setMatrixAt(si++,_m); }
  pines.instanceMatrix.needsUpdate=true;
  snowPines.instanceMatrix.needsUpdate=true;
  if(pines.instanceColor) pines.instanceColor.needsUpdate=true;

  for(const c of consist){
    applyTrainXform(c.car, wrapTau(u + c.d/R), 0, 0);
  }
}

let dragging=false, lastPX=0, lastPY=0, pointers=new Map();
let pinch0=0, fov0=DEFAULT_FOV;

function markInput(){ lastInput = performance.now()/1000; holdLook=false; startRailSound(); }

function onPtrDown(e){
  canvas.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===1){ dragging=true; lastPX=e.clientX; lastPY=e.clientY; }
  if(pointers.size===2){
    const a=[...pointers.values()];
    pinch0=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    fov0=lookFov;
  }
  markInput();
  $hint.classList.add('gone');
}
function onPtrMove(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const a=[...pointers.values()];
    const d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    if(pinch0>10){
      lookFov=clamp(fov0 * (pinch0/Math.max(20,d)), 28, 85);
    }
    markInput();
    return;
  }
  if(!dragging) return;
  const dx=e.clientX-lastPX, dy=e.clientY-lastPY;
  lastPX=e.clientX; lastPY=e.clientY;
  const sens=0.0045 * (lookFov/54);
  lookYaw -= dx*sens;
  lookPitch += dy*sens;
  lookPitch=clamp(lookPitch, -1.45, 1.45);
  markInput();
}
function onPtrUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch0=0;
  if(pointers.size===0) dragging=false;
}
canvas.addEventListener('pointerdown', onPtrDown);
canvas.addEventListener('pointermove', onPtrMove);
window.addEventListener('pointerup', onPtrUp);
window.addEventListener('pointercancel', onPtrUp);
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  lookFov=clamp(lookFov + e.deltaY*0.03, 28, 85);
  markInput();
  $hint.classList.add('gone');
}, {passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* optional rail sound after first tap */
let audioCtx=null, gainRail=null;
function startRailSound(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    gainRail=audioCtx.createGain();
    gainRail.gain.value=0.04;
    gainRail.connect(audioCtx.destination);
    const rumble=audioCtx.createOscillator();
    rumble.type='sawtooth'; rumble.frequency.value=52;
    const rumbleG=audioCtx.createGain(); rumbleG.gain.value=0.012;
    const filt=audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=180;
    rumble.connect(filt); filt.connect(rumbleG); rumbleG.connect(gainRail);
    rumble.start();
    const click=()=>{
      if(!audioCtx) return;
      const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=190;
      const g=audioCtx.createGain();
      const t=audioCtx.currentTime;
      g.gain.setValueAtTime(0.05,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      o.connect(g); g.connect(gainRail);
      o.start(t); o.stop(t+0.08);
    };
    window.__railClick=click;
  }catch(e){ audioCtx=null; }
}

let exposure = 1.08;
let tunnelSmooth=0;
let exitBloom=0;
let prevTun=0;
let cubeN=0;
let t0 = performance.now()/1000;
let fixedT = null;
let ready=false;
let lastReal=t0;
let fpsEma=30;
let lastClickDist=-999;

function currentT(){
  if(fixedT!=null) return fixedT;
  return performance.now()/1000 - t0;
}

function applyLook(dt, t){
  const now = performance.now()/1000;
  if(!holdLook && !dragging && pointers.size===0 && lastInput>0 && (now-lastInput)>IDLE_S){
    const k=1-Math.exp(-dt*1.6);
    lookYaw += (DEFAULT_YAW-lookYaw)*k;
    lookPitch += (DEFAULT_PITCH-lookPitch)*k;
    lookFov += (DEFAULT_FOV-lookFov)*k;
  }
  const dist=t*SPEED;
  const joint=dist%25;
  const clack=Math.exp(-joint*7)*0.01;
  const bounce=Math.sin(t*11.7)*0.0035 + Math.sin(t*3.1)*0.007 + clack;
  const roll=Math.sin(t*2.55)*0.007 + Math.sin(t*6.8)*0.0025;
  const yawS=Math.sin(t*1.65)*0.0035;
  if(window.__railClick && dist-lastClickDist>=25){
    lastClickDist=Math.floor(dist/25)*25;
    window.__railClick();
  }

  camera.position.set(CAM_LOCAL.x, CAM_LOCAL.y+bounce, CAM_LOCAL.z);
  camera.fov=lookFov;
  camera.updateProjectionMatrix();

  const cy=Math.cos(lookYaw+yawS), sy=Math.sin(lookYaw+yawS);
  const cp=Math.cos(lookPitch), sp=Math.sin(lookPitch);
  const dir=new THREE.Vector3(cp*cy, sp, cp*sy);
  const up=new THREE.Vector3(Math.sin(roll), Math.cos(roll), 0).normalize();
  const rotM=new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), dir, up);
  camera.quaternion.setFromRotationMatrix(rotM);
}

function renderFrame(dt){
  const t=currentT();
  const u=wrapTau((t*SPEED)/R);

  applyTrainXform(trainGroup, u, 0, 0);
  updateMoving(u);

  const tun=inTunnelU(u);
  tunnelSmooth += (tun-tunnelSmooth)*Math.min(1, dt*3.2);
  skyMat.uniforms.tunnel.value=tunnelSmooth*0.96;
  if(window.__lakeMat) window.__lakeMat.uniforms.time.value=t;

  let targetExp=1.12;
  if(tun>0.12) targetExp=0.70 + 0.12*(1-tun);
  if(prevTun>0.55 && tun<0.55) exitBloom=1;
  prevTun=tun;
  exitBloom=Math.max(0, exitBloom-dt*0.42);
  if(exitBloom>0 && tun<0.75) targetExp += exitBloom*1.85;

  const rate = targetExp>exposure ? 2.6 : 1.05;
  exposure += (targetExp-exposure)*(1-Math.exp(-dt*rate));
  renderer.toneMappingExposure = exposure;

  sun.intensity = 3.1*(1-tunnelSmooth*0.92);
  hemi.intensity = 0.7*(1-tunnelSmooth*0.72);
  sunFill.intensity = 0.28*(1-tunnelSmooth*0.9);
  const cabinBoost = 1 + tunnelSmooth*1.8;
  cabinLight.intensity=1.35*cabinBoost;
  cabinLight2.intensity=0.7*cabinBoost;
  cabinLight3.intensity=0.55*cabinBoost;
  const tunnelFill=interiorGroup.getObjectByName("tunnelFill");
  if(tunnelFill) tunnelFill.intensity=0.2+tunnelSmooth*2.8;
  glassMats.forEach(m=>{
    m.opacity = 0.09 + tunnelSmooth*0.22;
    m.envMapIntensity = 0.9 + tunnelSmooth*2.2 + exitBloom*0.4;
  });
  scene.fog.density = 0.0007 + tunnelSmooth*0.0010;
  scene.fog.color.setRGB(
    lerp(0.61, 0.03, tunnelSmooth),
    lerp(0.71, 0.035, tunnelSmooth),
    lerp(0.78, 0.04, tunnelSmooth)
  );
  renderer.setClearColor(scene.fog.color, 1);

  applyLook(dt, t);

  cubeN++;
  const cubeEvery = softwareGL? 10 : 3;
  if(cubeN%cubeEvery===1){
    worldGroup.visible=false; sky.visible=false;
    interiorGroup.traverse(o=>{ if(o.userData.isGlass) o.visible=false; });
    cubeCam.update(renderer, scene);
    interiorGroup.traverse(o=>{ if(o.userData.isGlass) o.visible=true; });
    worldGroup.visible=true; sky.visible=true;
  }

  const blurAmt = (softwareGL?0.55:0.85) * (1-tunnelSmooth*0.35);
  renderer.setRenderTarget(extRT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  postMat.uniforms.tDiffuse.value=extRT.texture;
  postMat.uniforms.tDepth.value=extRT.depthTexture;
  postMat.uniforms.blurAmt.value=blurAmt;
  postMat.uniforms.res.value.set(extRT.width, extRT.height);
  postMat.uniforms.camNear.value=camera.near;
  postMat.uniforms.camFar.value=camera.far;
  postMat.uniforms.exposureBoost.value=1+exitBloom*0.45;
  postMat.uniforms.bloom.value=exitBloom;
  renderer.render(postScene, postCam);
}

function tick(){
  const now=performance.now()/1000;
  let dt=Math.min(0.05, now-lastReal);
  lastReal=now;
  if(dt>0) fpsEma = fpsEma*0.9 + (1/dt)*0.1;
  if(!softwareGL && quality==='high' && fpsEma<22 && ready){
    quality='med'; applyPixelRatio();
  }
  renderFrame(dt);
  if(!ready){
    ready=true;
    $load.classList.add('gone');
    setTimeout(()=>{ if($load.parentNode) $load.remove(); }, 900);
    window.__ready=true;
  }
  requestAnimationFrame(tick);
}

window.addEventListener('resize', ()=>{ applyPixelRatio(); resize(); });
resize();

function snapToTime(t){
  fixedT = t;
  lastInput=performance.now()/1000;
  const u=wrapTau((t*SPEED)/R);
  const tun=inTunnelU(u);
  tunnelSmooth = tun;
  // If we are just past the exit, flash the bloom so screenshots can show it.
  const justOut = tun<0.05 && sectorW(u, TUN_B, TUN_B+0.18, 0.02)>0;
  exitBloom = justOut ? 0.85 : 0;
  exposure = justOut ? 2.1 : (tun>0.5 ? 0.75 : 1.12);
  prevTun = tun;
  renderer.toneMappingExposure = exposure;
}
window.__setT = (t)=>{ snapToTime(t); };
window.__setU = (u)=>{ snapToTime((wrapTau(u)*R)/SPEED); };
window.__setSegment = (name)=>{
  const v=U[name]; if(v==null) return;
  snapToTime((v*R)/SPEED);
};
window.__setLook = (yaw,pitch,fov)=>{
  if(yaw!=null) lookYaw=yaw;
  if(pitch!=null) lookPitch=pitch;
  if(fov!=null) lookFov=fov;
  holdLook=true;
};
window.__resetLook = ()=>{ lookYaw=DEFAULT_YAW; lookPitch=DEFAULT_PITCH; lookFov=DEFAULT_FOV; holdLook=true; };
window.__forceRender = ()=>{ renderFrame(1/30); };
window.__state = ()=>{
  const t=currentT(), u=wrapTau((t*SPEED)/R);
  return { t, u, tun:inTunnelU(u), exposure, fov:lookFov, yaw:lookYaw, pitch:lookPitch, quality, softwareGL, gl:window.__gl, fps:fpsEma, bloom:exitBloom };
};
window.__ready=false;
window.__quality=quality;

setTimeout(()=>$hint.classList.add('gone'), 7000);
lastInput = 0;
requestAnimationFrame(tick);
</script>
</body>
</html>
